<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWRP C3B2 — Master Document List Dashboard</title>
</head>
<body>
<div id="app"></div>
<script type="module">

/* ===== xlsx-reader.mjs ===== */
// xlsx-reader.mjs — zero-dependency .xlsx reader (ZIP + XML).
// Runs in Node (v18+) and modern browsers (DecompressionStream + Response are global).
// Reads: sharedStrings, workbook sheet map, and any worksheet as { rows:[ {A:val,...} ] , maxRow }.
// Dates are returned as Excel serial numbers; the pipeline converts them using the Code column-map "Date" type.

const EOCD = 0x06054b50;
const CDH  = 0x02014b50;
const LFH  = 0x04034b50;

function colToNum(letters){ let n=0; for(const ch of letters.toUpperCase()) n=n*26+(ch.charCodeAt(0)-64); return n; }
function numToCol(n){ let s=''; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }

async function inflateRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(buf);
}

async function unzip(buf){
  const bytes = new Uint8Array(buf);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  // locate End Of Central Directory — scan BACKWARD from the tail so the LAST
  // occurrence is found, as required by the ZIP spec (a comment or data earlier
  // in the file can contain the magic bytes; only the last match is the real EOCD).
  let eocd = -1;
  const min = Math.max(0, bytes.length - 65557);
  for(let i=bytes.length-22; i>=min; i--){
    if(dv.getUint32(i, true) === EOCD){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Not a valid ZIP/XLSX (EOCD not found)');
  const cdOffset = dv.getUint32(eocd+16, true);
  const total = dv.getUint16(eocd+10, true);
  const files = {};
  let p = cdOffset;
  for(let i=0; i<total; i++){
    if(dv.getUint32(p, true) !== CDH) break;
    const method = dv.getUint16(p+10, true);
    const compSize = dv.getUint32(p+20, true);
    const nameLen = dv.getUint16(p+28, true);
    const extraLen = dv.getUint16(p+30, true);
    const commentLen = dv.getUint16(p+32, true);
    const lho = dv.getUint32(p+42, true);
    const next = p + 46 + nameLen + extraLen + commentLen;
    // The local file header must carry the LFH signature. If it doesn't, the
    // offset recorded in the central directory is bogus, and reading
    // nameLen/extraLen from it would silently slice the wrong bytes — skip
    // this entry rather than trusting it (and keep walking the directory).
    if(lho + 30 > bytes.length || dv.getUint32(lho, true) !== LFH){ p = next; continue; }
    const nameBytes = bytes.subarray(p+46, p+46+nameLen);
    const name = new TextDecoder().decode(nameBytes);
    // local header: nameLen/extraLen at +26/+28
    const lNameLen = dv.getUint16(lho+26, true);
    const lExtraLen = dv.getUint16(lho+28, true);
    const dataStart = lho + 30 + lNameLen + lExtraLen;
    let data = bytes.subarray(dataStart, dataStart + compSize);
    if(method === 8) data = await inflateRaw(data);
    files[name] = data;
    p = next;
  }
  return files;
}

function decodeUtf8(bytes){ return new TextDecoder().decode(bytes); }

// minimal attribute extractor for a single tag's attribute string
function attrs(str){
  const out = {};
  const re = /([\w:]+)\s*=\s*"([^"]*)"/g; let m;
  while((m = re.exec(str))) out[m[1]] = m[2];
  return out;
}

function unescXml(s){
  // XML entity decode — must run on every string extracted from raw XML text.
  // Without this, any cell value containing & < > ' " arrives as &amp; &lt; etc.
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
}

function parseSharedStrings(xmlBytes){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const list = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g; let m;
  while((m = siRe.exec(xml))){
    const inner = m[1];
    let text = '', t;
    const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
    while((t = tRe.exec(inner))) text += unescXml(t[1]);
    list.push(text);
  }
  return list;
}

function parseWorkbook(xmlBytes){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const sheets = {}; // name -> rId
  const sRe = /<sheet\b([^>]*)>/g; let m;
  while((m = sRe.exec(xml))){
    const a = attrs(m[1]);
    if(a.name && a['r:id']) sheets[a.name] = a['r:id'];
  }
  return sheets;
}

function parseRels(xmlBytes){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const map = {}; // Id -> Target
  const rRe = /<Relationship\b([^>]*)>/g; let m;
  while((m = rRe.exec(xml))){
    const a = attrs(m[1]);
    if(a.Id && a.Target) map[a.Id] = a.Target;
  }
  return map;
}

function cellValue(tagInner, shared){
  // tagInner is the text of a <c ...>...</c> block
  const a = attrs(tagInner);
  const t = a.t || '';
  const isMatch = /<is>([\s\S]*?)<\/is>/.exec(tagInner);
  let vText = '';
  if(isMatch){
    const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g; let tm;
    while((tm = tRe.exec(isMatch[1]))) vText += unescXml(tm[1]);
  } else {
    const vMatch = /<v>([\s\S]*?)<\/v>/.exec(tagInner);
    if(vMatch) vText = vMatch[1];
  }
  const v = vText.trim();
  if(v === '') return undefined;
  if(t === 's') return shared[parseInt(v,10)] ?? v;
  if(t === 'inlineStr' || t === 'str') return v;
  if(t === 'b') return v === '1' || v === 'true';
  // default: number (also covers date serials — pipeline converts by column type)
  if(/^-?\d+(\.\d+)?$/.test(v)) return parseFloat(v);
  return v;
}

function parseSheet(xmlBytes, shared){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const rows = []; // 1-based; rows[0] unused
  // find each <c ...>...</c> OR self-closing (Excel never self-closes <c> with content, but be safe)
  const cRe = /<c\b([\s\S]*?)<\/c>/g; let m;
  while((m = cRe.exec(xml))){
    const block = m[1] + '</c>'; // ensure we have closing for attrs+inner
    const open = /<c\b([^>]*)>/.exec(m[1].split('>')[0] + '>');
    const a = attrs(open ? open[1] : m[1]);
    const ref = a.r; if(!ref) continue;
    const col = ref.replace(/\d+$/, '');
    const rowNum = parseInt(ref.match(/\d+$/)[0], 10);
    const val = cellValue(block, shared);
    if(val === undefined) continue;
    if(!rows[rowNum]) rows[rowNum] = {};
    rows[rowNum][col] = val;
  }
  let maxRow = 0;
  for(let i=1;i<rows.length;i++) if(rows[i]) maxRow = i;
  return { rows, maxRow };
}

async function readXlsx(buffer){
  const files = await unzip(buffer);
  const shared = parseSharedStrings(files['xl/sharedStrings.xml']);
  const sheetRid = parseWorkbook(files['xl/workbook.xml']);
  const rels = parseRels(files['xl/_rels/workbook.xml.rels']);
  const sheets = {};
  for(const name of Object.keys(sheetRid)){
    const rid = sheetRid[name];
    let target = rels[rid] || '';
    target = target.replace(/^\//, '');
    const key = (target.startsWith('xl/') ? target : 'xl/' + target);
    const data = files[key];
    sheets[name] = data ? parseSheet(data, shared) : { rows: [], maxRow: 0 };
  }
  return { sheets, sharedStrings: shared };
}


/* ===== pipeline.mjs ===== */
// pipeline.mjs — builds the consolidated document model from a parsed workbook.
// Pure logic (no DOM). Consumed by render (browser) and test_pipeline (Node).

const EXCLUDE_STAGES = ['Deleted', 'Void', 'Superseded'];

// ---- Excel serial date helpers ----
function excelSerialToISO(serial){
  if(typeof serial !== 'number' || !isFinite(serial)) return null;
  const ms = Math.round((serial - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if(isNaN(d)) return null;
  return d.toISOString().slice(0, 10);
}
function isoToDate(iso){ if(!iso) return null; const d = new Date(iso + 'T00:00:00Z'); return isNaN(d) ? null : d; }
// Tolerant parse of the project-start cell (Code!A6): Excel serial, ISO, or text date.
function parseProjectStart(cell){
  if(cell == null || cell === '') return null;
  if(typeof cell === 'number' && isFinite(cell)) return excelSerialToISO(cell);
  const s = String(cell).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return null;
}
// Tolerant parse of the "List End Row" cell (Code!B8): numeric; default 4000.
function parseListEndRow(cell){
  if(cell == null || cell === '') return 4000;
  const n = typeof cell === 'number' ? cell : parseInt(String(cell).replace(/[^\d]/g, ''), 10);
  return (isFinite(n) && n > 0) ? n : 4000;
}
function workingDaysBetween(d1, d2){
  // signed working-day count from d1 to d2 (Mon–Fri only), weekends excluded
  if(!d1 || !d2) return null;
  let sign = 1; if(d2 < d1){ [d1, d2] = [d2, d1]; sign = -1; }
  let count = 0; let cur = new Date(d1.getTime());
  while(cur <= d2){
    const day = cur.getUTCDay();
    if(day !== 0 && day !== 6) count++;
    cur.setUTCDate(cur.getUTCDate() + 1);
  }
  return sign * count;
}

function normalizeBool(v){
  if(v === true || v === 'YES' || v === 'TRUE') return 'YES';
  if(v === false || v === 'NO' || v === 'FALSE') return 'NO';
  if(v === '' || v == null) return '';
  return String(v).toUpperCase().trim();
}

function readBlock(sheet, codeCol){
  const items = []; const codes = new Set();
  const labelCol = numToCol(colToNum(codeCol) + 1);
  for(let r = 2; r <= sheet.maxRow; r++){
    const row = sheet.rows[r]; if(!row) continue;
    const code = row[codeCol];
    if(code == null || code === '') continue;
    const label = row[labelCol] != null ? String(row[labelCol]) : '';
    items.push({ code: String(code), label });
    codes.add(String(code));
  }
  return { items, codes };
}

function readErrorBlock(sheet){
  const map = {}; const order = [];
  for(let r = 2; r <= sheet.maxRow; r++){
    const row = sheet.rows[r]; if(!row) continue;
    const code = row.AI; if(code == null || code === '') continue;
    map[String(code)] = { group: row.AJ != null ? String(row.AJ) : '', rule: row.AK != null ? String(row.AK) : '', severity: row.AL != null ? String(row.AL) : 'Warning' };
    order.push(String(code));
  }
  return { map, order };
}

function buildModel(workbook, options = {}){
  const today = options.today ? isoToDate(options.today) : new Date();
  const todayISO = today.toISOString().slice(0, 10);
  const codeSheet = workbook.sheets['Code'];

  // --- metadata block (Code rows 1–11): label (A) → value (B), read by label ---
  // Contract-driven: read by the A-column label (not a fixed row) so the block is
  // resilient to row insertion/reordering and new rows (e.g. Dashboard Title) are
  // picked up automatically. Supplies Project Title, Dashboard Title, Project Start
  // Date (B6), List End Row (B8) and the review-duration rows.
  const codeMeta = {};
  for(let r = 1; r <= 11; r++){
    const row = codeSheet.rows[r]; if(!row) continue;
    const label = row.A; const val = row.B;
    if(label == null || String(label).trim() === '') continue;
    codeMeta[String(label).trim()] = (val == null ? '' : val);
  }
  // --- project start date (Code "Project Start Date") — x-axis anchor for time-based views ---
  const projectStartDate = parseProjectStart(codeMeta['Project Start Date']);
  // --- List End Row (Code "List End Row") — advisory row limit; data beyond it is kept, not dropped ---
  const listEndRow = parseListEndRow(codeMeta['List End Row']);
  // --- titles (read from the worksheet — never hard-coded) ---
  const projectTitle = (codeMeta['Project Title'] != null && codeMeta['Project Title'] !== '') ? String(codeMeta['Project Title']) : null;
  const dashboardTitle = (codeMeta['Dashboard Title'] != null && codeMeta['Dashboard Title'] !== '') ? String(codeMeta['Dashboard Title']) : null;

  // --- column map (rows 12-36) ---
  const columnMap = {}; const fieldOrder = [];
  for(let r = 12; r <= 36; r++){
    const row = codeSheet.rows[r]; if(!row) continue;
    const field = row.A; const raw = row.B; const type = row.C;
    if(!field || !raw) continue;
    const letter = String(raw).replace(/^Column-/, '').replace(/[^A-Za-z]/g, '').toUpperCase();
    columnMap[field] = { letter, type: (type || '').trim(), index: colToNum(letter) };
    fieldOrder.push(field);
  }
  const letterOf = f => columnMap[f] ? columnMap[f].letter : null;
  const typeOf = f => columnMap[f] ? columnMap[f].type : null;

  // --- review durations (rows 9-11) ---
  const reviewRules = { firstClientReview: 20, resubmissionDuration: 14 };
  for(let r = 9; r <= 11; r++){
    const row = codeSheet.rows[r]; if(!row) continue;
    const name = String(row.A || ''); const val = parseInt(row.B, 10);
    if(isNaN(val)) continue;
    if(/first client review/i.test(name)) reviewRules.firstClientReview = val;
    else if(/resubmission/i.test(name)) reviewRules.resubmissionDuration = val;
  }

  // --- lookup blocks ---
  const lookups = {
    stage: readBlock(codeSheet, 'E'),
    uesh: readBlock(codeSheet, 'H'),
    projectCode: readBlock(codeSheet, 'K'),
    prefix: readBlock(codeSheet, 'N'),
    docType: readBlock(codeSheet, 'Q'),
    disciplineCode: readBlock(codeSheet, 'T'),
    authority: readBlock(codeSheet, 'Z'),
    submissionStatus: readBlock(codeSheet, 'AC'),
    approval: readBlock(codeSheet, 'AF'),
  };
  const errorBlock = readErrorBlock(codeSheet);

  // --- BQ reference set ---
  const bqSheet = workbook.sheets['BQ'];
  const bqSet = new Set();
  if(bqSheet){ for(let r = 2; r <= bqSheet.maxRow; r++){ const v = bqSheet.rows[r] && bqSheet.rows[r].A; if(v != null && v !== '') bqSet.add(String(v)); } }

  // --- discipline tab discovery ---
  const ueshNames = [...lookups.uesh.codes];
  const available = [], noListYet = [], excluded = ['BQ', 'Notes', 'Dashboard', 'Code'];
  Object.keys(workbook.sheets).forEach(name => {
    if(excluded.includes(name)) return;
    if(ueshNames.includes(name)) available.push(name);
    else noListYet.push(name); // a non-document-list tab that is not a known discipline
  });
  const noListYetDisciplines = ueshNames.filter(n => !available.includes(n));

  // --- consolidate ---
  const records = [];
  const blankDocIssues = [];
  const warnings = [];
  for(const tab of available){
    const sheet = workbook.sheets[tab]; if(!sheet) continue;
    let tabMaxDataRow = 1;
    for(let r = 2; r <= sheet.maxRow; r++){
      const row = sheet.rows[r]; if(!row) continue;
      const hasContent = Object.values(row).some(v => v !== '' && v != null);
      if(hasContent && r > tabMaxDataRow) tabMaxDataRow = r;
      const fields = {};
      fieldOrder.forEach(f => {
        let v = row[letterOf(f)];
        if(v == null) return;
        if(typeOf(f) === 'Date' && typeof v === 'number'){ const iso = excelSerialToISO(v); if(iso) v = iso; }
        else if(typeOf(f) === 'Boolean'){ v = normalizeBool(v); }
        else v = (typeof v === 'string') ? v : String(v);
        fields[f] = v;
      });
      const docNo = fields['Document No.'];
      if(docNo == null || docNo === ''){
        // V-01: populated row with blank Document No. (still surfaced, not added)
        const otherwise = Object.keys(fields).some(k => k !== 'Document No.' && fields[k] !== '' && fields[k] != null);
        if(otherwise) blankDocIssues.push({ code: 'V-01', sourceTab: tab, rownum: r });
        continue;
      }
      const stage = fields['Stage'] || '';
      const isActive = !EXCLUDE_STAGES.includes(stage);
      records.push({ sourceTab: tab, rownum: r, fields, discipline: fields['UESH Discipline'] || '', stage, isActive, docNo });
    }
    if(tabMaxDataRow > listEndRow){
      warnings.push({ level:'warn', code:'W-ENDROW', tab, actual: tabMaxDataRow, limit: listEndRow,
        message: `List End Row (Code!B8 = ${listEndRow}) exceeded on tab "${tab}": ${tabMaxDataRow} data rows found. All rows are included (none dropped); raise Code!B8 if this is expected.` });
    }
  }

  // --- validation ---
  const issues = [];
  const severityOf = code => (errorBlock.map[code] && errorBlock.map[code].severity) || 'Warning';
  const messageOf = code => (errorBlock.map[code] && errorBlock.map[code].rule) || (`Rule ${code} (generic message)`);
  const mkIssue = (code, rec) => ({
    code, severity: severityOf(code), message: messageOf(code),
    sourceTab: rec ? rec.sourceTab : null, rownum: rec ? rec.rownum : null,
    docNo: rec ? rec.docNo : null, discipline: rec ? rec.discipline : null
  });
  const inSet = (set, v) => v != null && v !== '' && set.has(String(v));

  // V-13 (contract): lookup block with label but empty code
  Object.entries(lookups).forEach(([key, blk]) => {
    blk.items.forEach(it => { if(it.label && !it.code) issues.push({ code: 'V-13', severity: severityOf('V-13'), message: messageOf('V-13') + ` (block ${key})`, sourceTab: 'Code', rownum: null, docNo: null, discipline: null }); });
  });
  blankDocIssues.forEach(b => issues.push(mkIssue('V-01', b)));

  // duplicate Document No. (V-26)
  const docCount = {};
  records.forEach(rec => { const k = rec.docNo; docCount[k] = (docCount[k] || 0) + 1; });

  for(const rec of records){
    const f = rec.fields;
    const M = f['Document No.'];
    const B = f['Stage'] || '';
    const C = f['UESH Discipline'] || '';
    const J = f['Discipline'] || '';
    const I = f['Doc Type'] || '';
    const Q = f['Authority'] || '';
    const W = f['Submission Status'] || '';
    const G = f['Project Code'] || '';
    const H = f['Project Prefix'] || '';
    const K = f['Number'] || '';
    const Y = f['Latest Approval Status'] || '';
    const E = f['BQ Number'] || '';
    const P = f['As-Built'] || '';
    const R = f['Vendor Data'] || '';
    const S = f['Planned 1st Issue Date'] || '';
    const T = f['Forecast 1st Issue Date'] || '';
    const U = f['Actual 1st Issue Date'] || '';
    const V = f['Prolog Number'] || '';
    const X = f['Latest Approval Date'] || '';
    const N = f['Document Title'] || '';

    if(!inSet(lookups.stage.codes, B)) issues.push(mkIssue('V-02', rec));
    if(!inSet(lookups.uesh.codes, C)) issues.push(mkIssue('V-03', rec));
    if(J !== '' && !inSet(lookups.disciplineCode.codes, J)) issues.push(mkIssue('V-04', rec));
    if(I !== '' && !inSet(lookups.docType.codes, I)) issues.push(mkIssue('V-05', rec));
    if(Q !== '' && !inSet(lookups.authority.codes, Q)) issues.push(mkIssue('V-06', rec));
    if(W !== '' && !inSet(lookups.submissionStatus.codes, W)) issues.push(mkIssue('V-07', rec));
    if(Y !== '' && !inSet(lookups.approval.codes, Y)) issues.push(mkIssue('V-08', rec));
    if(P === 'YES' && U === '') issues.push(mkIssue('V-10', rec));
    if(EXCLUDE_STAGES.includes(B)) issues.push(mkIssue('V-12', rec));
    if(G !== '' && !inSet(lookups.projectCode.codes, G)) issues.push(mkIssue('V-14', rec));
    if(/xxxx/i.test(M)) issues.push(mkIssue('V-15', rec));
    // V-17 composition G-H-I-J-K (J = client Discipline Code)
    if(G && H && I && J && K){ const expected = [G, H, I, J, K].join('-'); if(M !== expected) issues.push(mkIssue('V-17', rec)); }
    if((W !== '') !== (V !== '')) issues.push(mkIssue('V-19', rec));
    if(U !== '' && (V === '' || W === '')) issues.push(mkIssue('V-18', rec));
    if(Y === 'APP' && X === '') issues.push(mkIssue('V-11', rec));
    if(W === 'RTR' && (Y === '' || /void/i.test(Y))) issues.push(mkIssue('V-16', rec));
    if(['APP', 'AWC', 'REJ', 'NAP'].includes(Y) && (U === '' || X === '')) issues.push(mkIssue('V-20', rec));
    if(X !== '' && (Y === '' || (U !== '' && isoToDate(X) < isoToDate(U)))) issues.push(mkIssue('V-21', rec));
    // V-09 date order — fire ONCE per document even if multiple pairs are out of order
    if((S && T && isoToDate(T) < isoToDate(S)) ||
       (T && U && isoToDate(U) < isoToDate(T)) ||
       (S && U && isoToDate(U) < isoToDate(S))) issues.push(mkIssue('V-09', rec));
    if(U !== '' && (S === '' || T === '')) issues.push(mkIssue('V-22', rec));
    // V-23 — fire ONCE per document if any date is in the future
    if([S, T, U, X].some(d => d && isoToDate(d) && isoToDate(d) > today)) issues.push(mkIssue('V-23', rec));
    // V-28: a 1st-issue date precedes the declared project start date (Code!B6). Fires once per
    // document if any of Planned/Forecast/Actual is earlier than projectStartDate (only when B6 set).
    if(projectStartDate){ const ps = isoToDate(projectStartDate);
      if((S && isoToDate(S) && isoToDate(S) < ps) || (T && isoToDate(T) && isoToDate(T) < ps) || (U && isoToDate(U) && isoToDate(U) < ps))
        issues.push(mkIssue('V-28', rec)); }
    if(E !== '' && !bqSet.has(String(E))) issues.push(mkIssue('V-24', rec));
    const required = [N, C, B, I, J, G, H, K];
    if(required.some(v => v === '' || v == null)) issues.push(mkIssue('V-25', rec));
    if(docCount[M] > 1) issues.push(mkIssue('V-26', rec));
    const boolVal = v => (v === 'YES' || v === 'NO' || v === '');
    if(!boolVal(P) || !boolVal(R)) issues.push(mkIssue('V-27', rec));
  }

  // --- KPIs (active only) ---
  const active = records.filter(r => r.isActive);
  const cnt = pred => active.filter(pred).length;
  const kpis = {
    totalPlanned: active.length,
    submitted: cnt(r => (r.fields['Actual 1st Issue Date'] || '') !== ''),
    approvedAPP: cnt(r => r.fields['Latest Approval Status'] === 'APP'),
    approvedAWC: cnt(r => r.fields['Latest Approval Status'] === 'AWC'),
    rejected: cnt(r => r.fields['Latest Approval Status'] === 'REJ'),
    notApproved: cnt(r => r.fields['Latest Approval Status'] === 'NAP'),
    asBuiltYes: cnt(r => r.fields['As-Built'] === 'YES'),
    vendorYes: cnt(r => r.fields['Vendor Data'] === 'YES'),
  };

  // --- Overdue (3 flavours) ---
  const dT = isoToDate(todayISO);
  const firstOverdue = active.filter(r => { const t = r.fields['Forecast 1st Issue Date'] || r.fields['Planned 1st Issue Date']; return t && (r.fields['Actual 1st Issue Date'] || '') === '' && isoToDate(t) <= dT; });
  const subsequentOverdue = active.filter(r => {
    const y = r.fields['Latest Approval Status']; const x = r.fields['Latest Approval Date']; const u = r.fields['Actual 1st Issue Date'];
    return u && ['REJ', 'RTR'].includes(y) && x && workingDaysBetween(isoToDate(x), dT) > reviewRules.resubmissionDuration;
  });
  const clientReviewOverdue = active.filter(r => {
    const w = r.fields['Submission Status']; const u = r.fields['Actual 1st Issue Date'];
    return w === 'SUR' && u && workingDaysBetween(isoToDate(u), dT) > reviewRules.firstClientReview;
  });
  kpis.overdueFirst = firstOverdue.length;
  kpis.overdueResubmission = subsequentOverdue.length;
  kpis.overdueClientReview = clientReviewOverdue.length;

  // --- Data completeness % (passing V-17..V-27) ---
  const completenessGroup = new Set(['V-17','V-18','V-19','V-20','V-21','V-22','V-23','V-24','V-25','V-26','V-27']);
  const activeKeys = new Set(active.map(r => r.sourceTab + '!' + r.rownum));
  const activeBad = new Set();
  issues.forEach(i => { if(completenessGroup.has(i.code) && activeKeys.has(i.sourceTab + '!' + i.rownum)) activeBad.add(i.sourceTab + '!' + i.rownum); });
  kpis.completeness = active.length ? Math.round((1 - activeBad.size / active.length) * 1000) / 10 : null;
  kpis.activeDisciplines = new Set(active.map(r => r.discipline).filter(Boolean)).size;

  // --- Charts ---
  const groupCount = (keyFn, scope) => { const m = {}; scope.forEach(r => { const k = keyFn(r); if(k == null || k === '') return; m[k] = (m[k] || 0) + 1; }); return m; };
  const toArr = m => Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  const approvalMap = groupCount(r => r.fields['Latest Approval Status'] || '—', active);
  const approvalStatus = [
    { name: 'APP', value: approvalMap['APP'] || 0 },
    { name: 'AWC', value: approvalMap['AWC'] || 0 },
    { name: 'REJ', value: approvalMap['REJ'] || 0 },
    { name: 'NAP', value: approvalMap['NAP'] || 0 },
    { name: 'Not Available', value: active.filter(r => !['APP','AWC','REJ','NAP'].includes(r.fields['Latest Approval Status'] || '')).length },
  ];
  const charts = {
    docsByDiscipline: toArr(groupCount(r => r.discipline, active)),
    issueProgress: [
      { name: 'Planned', value: cnt(r => (r.fields['Planned 1st Issue Date'] || '') !== '') },
      { name: 'Forecast', value: cnt(r => (r.fields['Forecast 1st Issue Date'] || '') !== '') },
      { name: 'Actual', value: cnt(r => (r.fields['Actual 1st Issue Date'] || '') !== '') },
    ],
    approvalStatus,
    asBuilt: [
      { name: 'YES', value: cnt(r => r.fields['As-Built'] === 'YES') },
      { name: 'NO', value: cnt(r => r.fields['As-Built'] === 'NO') },
    ],
    byAuthority: toArr(groupCount(r => r.fields['Authority'], active)),
    byDocType: toArr(groupCount(r => r.fields['Doc Type'], active)),
    scheduleVariance: (() => {
      const ov = new Set([...firstOverdue, ...subsequentOverdue, ...clientReviewOverdue].map(r => r.sourceTab + '!' + r.rownum));
      const atRisk = active.filter(r => { const t = r.fields['Forecast 1st Issue Date'] || r.fields['Planned 1st Issue Date']; return t && (r.fields['Actual 1st Issue Date'] || '') === '' && isoToDate(t) > dT && workingDaysBetween(dT, isoToDate(t)) <= 14; });
      const onTrack = active.filter(r => { const k = r.sourceTab + '!' + r.rownum; return !ov.has(k) && !atRisk.includes(r); });
      return [
        { name: 'On track', value: onTrack.length },
        { name: 'At risk', value: atRisk.length },
        { name: 'Overdue – 1st', value: firstOverdue.length },
        { name: 'Overdue – Resub', value: subsequentOverdue.length },
        { name: 'Overdue – Client', value: clientReviewOverdue.length },
      ];
    })(),
    dqByDiscipline: [],
    dqByRule: toArr(groupCount(i => i.code, issues)),
  };
  const dqDisc = {}; issues.forEach(i => { if(i.discipline){ dqDisc[i.discipline] = (dqDisc[i.discipline] || 0) + 1; } });
  charts.dqByDiscipline = toArr(dqDisc);

  const overdueLists = {
    first: firstOverdue.map(r => ({ docNo: r.docNo, discipline: r.discipline, forecast: r.fields['Forecast 1st Issue Date'], sourceTab: r.sourceTab })),
    subsequent: subsequentOverdue.map(r => ({ docNo: r.docNo, discipline: r.discipline, lastOutcome: r.fields['Latest Approval Status'], approvalDate: r.fields['Latest Approval Date'], sourceTab: r.sourceTab })),
    clientReview: clientReviewOverdue.map(r => ({ docNo: r.docNo, discipline: r.discipline, submitted: r.fields['Actual 1st Issue Date'], sourceTab: r.sourceTab })),
  };

  return {
    meta: { generatedAt: new Date().toISOString(), workbookName: options.workbookName || '', today: todayISO, projectStartDate, listEndRow, projectTitle, dashboardTitle },
    contract: { columnMap, fieldOrder, reviewRules, errorBlock, noListYetDisciplines, lookups },
    tabs: { available, noListYet, excluded },
    records, issues, warnings, kpis, charts, overdueLists, completenessGroup: [...completenessGroup],
  };
}

    const y=r.fields['Latest Approval Status'];

function monthOptions(records, asof, projectStart){

  // with no submissions. The start month is the EARLIER of the project start (Code!B6) and
  // the earliest planned/forecast/actual first-issue date in the data — matching the
  // Issue-Progress "whole month range" rule, so months before B6 are reachable too.
  let dMin=null, dMax=null;

function renderAll(wrap){
  WRAP = wrap;

  try { renderFilters(document.getElementById('filterPanel'), MODEL, STATE, ()=>renderAll(wrap), refreshData); }
  catch(e){ reportPanelError('Filters & Utilities', document.getElementById('filterPanel'), e); }
  renderData(wrap, v);
}
function refreshData(){ renderData(WRAP, deriveView(MODEL, STATE)); }
function renderData(wrap, v){
  v = v || deriveView(MODEL, STATE);
  renderIssues = [];
  const safe = (label, id, fn) => { const p = document.getElementById(id); try { fn(p); } catch(e){ reportPanelError(label, p, e); } };
  safe('KPI Overview', 'kpiPanel', p => renderKPIs(p, v.kpis, MODEL));
  safe('Per-Discipline Summary Matrix', 'matrixPanel', p => renderMatrix(p, v.matrix, v.matrixMonths, v.curMonth));
  safe('Charts', 'chartsPanel', p => renderCharts(p.querySelector('.charts'), v.charts));
  safe('Issue Progress', 'curvePanel', p => renderCurvePanel(p.querySelector('.curve-body'), v.monthlyProgress));
  safe('Overdue List', 'overduePanel', p => renderOverdue(p, {first:v.firstOverdue,sub:v.subOverdue,cli:v.cliOverdue}));
  safe('Validation Issues', 'validationPanel', p => renderValidation(p, v.issues, MODEL));

}

function filterSummary(){
  const defs = getFilterDefs(MODEL);
  const parts=[];
  defs.forEach(d=>{
    const s=STATE[d.key]; const total=optsOf(d).length;
    parts.push(d.label+': '+(isBaseSet(d,STATE)?'All':((s?s.size:0)+'/'+total)));
  });
  if(STATE.search) parts.push('Search: "'+STATE.search+'"');
  const allDefault = defs.every(d=>isBaseSet(d,STATE)) && !STATE.search;
  return allDefault ? 'All documents (no filter applied)' : parts.join(' · ');
}
function renderStatusBar(v){

function reportPanelError(label, panel, e){
  console.error('[render] '+label, e);
  const msg = (e && e.message) ? e.message : String(e);
  renderIssues.push({label, msg});
  if(!panel) return;
  let body = panel.querySelector('.panel-body');
  if(!body){ body = document.createElement('div'); body.className='panel-body'; }
  body.innerHTML = `<div class="panel-error"><b>⚠️ This panel could not be rendered.</b><br>${esc(label)} — ${esc(msg)}<br><span class="pe-detail">Open the browser console for the full error stack.</span></div>`;
  if(!panel.querySelector('.panel-body')) panel.appendChild(body);
}
function showRenderIssues(wrap){
  wrap.querySelectorAll('.render-issues').forEach(n=>n.remove());
  if(!renderIssues.length) return;
  const n = renderIssues.length;
  const names = renderIssues.map(r=>r.label).join(', ');
  const el = document.createElement('div');
  el.className = 'note render-issues';
  el.innerHTML = `⚠️ <b>${n} panel${n>1?'s':''} failed to render:</b> ${esc(names)}. See the affected panel(s) below for details; the rest of the dashboard is unaffected.`;
  wrap.insertBefore(el, wrap.firstChild);
}

function wireCollapse(panel){
  const btn = panel.querySelector('.collapse'); if(!btn) return;
  const apply = ()=>{ const on = collapsed.has(panel.id); panel.classList.toggle('collapsed', on); btn.textContent = on ? '+' : '−'; btn.title = on ? 'Expand panel' : 'Collapse panel'; };
  apply();
  btn.onclick = ()=>{ if(collapsed.has(panel.id)) collapsed.delete(panel.id); else collapsed.add(panel.id); apply(); };
}
function ensureCollapse(panel){
  if(!panel) return;
  let head=null;
  for(const ch of panel.children){ if(ch.classList && ch.classList.contains('panel-head')){ head=ch; break; } }
  if(!head){
    let h2=null;
    for(const ch of panel.children){ if(ch.tagName==='H2'){ h2=ch; break; } }
    if(!h2) return;
    head=document.createElement('div'); head.className='panel-head';
    panel.insertBefore(head, h2); head.appendChild(h2);
  }
  let ha=null;
  for(const ch of head.children){ if(ch.classList && ch.classList.contains('head-actions')){ ha=ch; break; } }
  if(!ha){ ha=document.createElement('div'); ha.className='head-actions'; head.appendChild(ha); }
  let body=null;
  for(const ch of panel.children){ if(ch.classList && ch.classList.contains('panel-body')){ body=ch; break; } }
  if(!body){
    body=document.createElement('div'); body.className='panel-body';
    let nxt=head.nextSibling;
    while(nxt){ const after=nxt.nextSibling; body.appendChild(nxt); nxt=after; }
    panel.appendChild(body);
  }
  let help = ha.querySelector('.help');
  if(!help){
    help = document.createElement('button'); help.className='help btn icon-btn'; help.textContent='?'; help.title='Panel help'; help.setAttribute('aria-label','Panel help');
    const coll = ha.querySelector('.collapse');
    if(coll) ha.insertBefore(help, coll); else ha.appendChild(help);
  }
  let has=false;
  for(const ch of ha.children){ if(ch.classList && ch.classList.contains('collapse')){ has=true; break; } }
  if(!has){
    const cb=document.createElement('button'); cb.className='collapse btn icon-btn'; cb.textContent='−'; cb.title='Collapse panel';
    ha.appendChild(cb);
  }
  help.onclick = ()=>openHelp(panel.id);
  wireCollapse(panel);
}

let helpModalEl=null;
function ensureHelpModal(){

  m.addEventListener('click', e=>{ if(e.target===m) m.hidden=true; });
  m.querySelector('.close').onclick=()=>{ m.hidden=true; };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !m.hidden) m.hidden=true; });
  (document.body||document.documentElement).appendChild(m);
  helpModalEl=m; return m;
}

function renderFilters(panel, model, state, rerender, dataOnly){
  const defs = getFilterDefs(model);
  const el = (pre, d) => document.getElementById(pre + d.key);   // 'tfBtn_' | 'tfPanel_' | 'tfCnt_'

  // ---------- Filters & Utilities panel: utilities only (Search + Reset) ----------
  panel.innerHTML = `<div class="panel-head"><h2>Filters & Utilities</h2>
    <div class="head-actions">
      <button id="fReset" class="btn btn-secondary">Reset filters</button>
      <button class="collapse btn icon-btn" title="Collapse panel" aria-label="Collapse panel">−</button>
    </div></div>
    <div class="panel-body"><div class="filters">
    <div class="filters-help">Use the <b>Discipline</b> and <b>Stage</b> buttons in the top bar to narrow the dashboard.</div>
    <div class="zone-label">Utilities</div>
    <div class="filters-utils">
      <div class="grp util"><span class="lbl">Search (Doc No / Title / Discipline)</span><input id="fSearch" value="${esc(state.search)}" placeholder="type…"></div>
    </div>
    </div></div>`;

  // Trigger badge: "All" at the counted baseline, otherwise "x of y" (y = every listed option).
  const sync = d => {
    const n = state[d.key].size, t = optsOf(d).length;
    const cnt = el('tfCnt_', d), btn = el('tfBtn_', d);
    if(cnt) cnt.textContent = isBaseSet(d, state) ? 'All' : `${n} of ${t}`;
    if(btn) btn.classList.toggle('is-filtered', !isBaseSet(d, state));
  };
  // Every change re-derives the whole dashboard from one combined state read — never decoupled.
  const applyAll = () => { defs.forEach(sync); dataOnly(); };

  // ---------- one dropdown per dimension (All/Clear at the TOP of each) ----------
  defs.forEach(d => {
    const p = el('tfPanel_', d); if(!p) return;
    p.hidden = true;
    p.innerHTML = `<div class="tf-actions">
        <button type="button" class="tf-act" data-act="all">All</button>
        <button type="button" class="tf-act" data-act="clear">Clear</button>
      </div>
      <div class="tf-list">${optsOf(d).map(v => { const off=(d.noCount||[]).includes(v); return `<label class="tf-item${off?' tf-nc':''}" title="${off?'Present in the list but never counted until you tick it':''}"><input type="checkbox" value="${esc(v)}" ${state[d.key].has(v) ? 'checked' : ''}><span>${esc(v === '' ? '（blank）' : v)}</span>${off?'<span class="nc">not counted</span>':''}</label>`; }).join('')}</div>`;
    const boxes = [...p.querySelectorAll('input[type=checkbox]')];
    boxes.forEach(cb => { cb.onchange = () => { cb.checked ? state[d.key].add(cb.value) : state[d.key].delete(cb.value); applyAll(); }; });
    p.querySelectorAll('.tf-act').forEach(b => {
      b.onclick = () => {
        state[d.key].clear();
        // All = the counted baseline; never-counted values stay off unless ticked one by one.
        if(b.dataset.act === 'all') baseOpts(d).forEach(v => state[d.key].add(v));
        boxes.forEach(c => { c.checked = state[d.key].has(c.value); });
        applyAll();
      };
    });
    sync(d);
  });

  panel.querySelector('#fSearch').oninput = e => { state.search = e.target.value; dataOnly(); };
  panel.querySelector('#fReset').onclick = () => {
    defs.forEach(d => {
      state[d.key].clear(); baseOpts(d).forEach(v => state[d.key].add(v));
      const p = el('tfPanel_', d);
      if(p) p.querySelectorAll('input[type=checkbox]').forEach(c => { c.checked = state[d.key].has(c.value); });
    });
    state.search = ''; state.rule = null;
    panel.querySelector('#fSearch').value = '';
    defs.forEach(sync);
    rerender();
  };
  wireCollapse(panel);

  // ---------- dropdown behaviour: only one open at a time ----------
  const closeAll = except => defs.forEach(d => {
    if(d.key === except) return;
    const p = el('tfPanel_', d), b = el('tfBtn_', d);
    if(p) p.hidden = true;
    if(b) b.setAttribute('aria-expanded', 'false');
  });
  if(!tfDocBound){
    tfDocBound = true;
    document.addEventListener('click', e => { if(!(e.target.closest && e.target.closest('.tf-wrap'))) closeAll(null); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAll(null); });
  }
  defs.forEach(d => {
    const b = el('tfBtn_', d), p = el('tfPanel_', d);
    if(!b || !p) return;
    b.onclick = e => {
      e.stopPropagation();
      const open = p.hidden;
      closeAll(d.key);
      p.hidden = !open;
      b.setAttribute('aria-expanded', String(open));
    };
  });
}

function matrixSVG(matrix){

}
function matrixCSV(matrix, curMonth){
  const cell = v => { const t = v==null?'' : String(v); return /[",\n\r]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const totalPlanned = matrix.reduce((a,m)=>a+(m.Planned||0),0) || 1;
  const pct = v => Math.round((v/totalPlanned)*100);
  const mLabel = curMonth || 'all';
  const cols = ['Discipline','Total Planned','Total Submitted','Submitted %','Plan ('+mLabel+')','Forecast ('+mLabel+')','Actual ('+mLabel+')','APP','AWC','REJ','NAP','Overdue 1st','Overdue Resub','Overdue Client'];
  const out = [cols.map(cell).join(',')];
  matrix.forEach(m=>{
    out.push([m.discipline, m.Planned, m.Submitted, pct(m.Submitted), m.PlanMo, m.FcastMo, m.ActualMo, m.Approved, m.AWC, m.REJ, m.NAP, m.ov1, m.ov2, m.ov3].map(cell).join(','));
    (m.stages||[]).forEach(s=> out.push(['  '+s.stage, s.Planned, s.Submitted, pct(s.Submitted), s.PlanMo, s.FcastMo, s.ActualMo, s.Approved, s.AWC, s.REJ, s.NAP, s.ov1, s.ov2, s.ov3].map(cell).join(',')));
  });
  const t = matrix.reduce((a,m)=>{ ['Planned','Submitted','PlanMo','FcastMo','ActualMo','Approved','AWC','REJ','NAP','ov1','ov2','ov3'].forEach(k=>a[k]+=(m[k]||0)); return a; }, {Planned:0,Submitted:0,PlanMo:0,FcastMo:0,ActualMo:0,Approved:0,AWC:0,REJ:0,NAP:0,ov1:0,ov2:0,ov3:0});
  out.push(['TOTAL', t.Planned, t.Submitted, pct(t.Submitted), t.PlanMo, t.FcastMo, t.ActualMo, t.Approved, t.AWC, t.REJ, t.NAP, t.ov1, t.ov2, t.ov3].map(cell).join(','));
  return out.join('\r\n');
}

function renderInteractive(host, charts, groupKey){
  host.innerHTML='';
  const BREAKDOWNS=[
    {group:'Documents', items:[
      {label:'Discipline', key:'docsByDiscipline', mode:'cycle'},
      {label:'Approval Status', key:'approvalStatus', mode:'status'},
      {label:'As-Built Status', key:'asBuilt', mode:'status'},
      {label:'Authority', key:'byAuthority', mode:'cycle'},
      {label:'Doc Type / Stage', key:'byDocType', mode:'cycle'},
      {label:'Schedule Variance', key:'scheduleVariance', mode:'status'}]},
    {group:'Issues', items:[
      {label:'DQ by Rule', key:'dqByRule', mode:'cycle'},
      {label:'DQ by Discipline', key:'dqByDiscipline', mode:'cycle'}]}];
  const groups = groupKey==='iss' ? BREAKDOWNS.filter(g=>g.group==='Issues') : BREAKDOWNS.filter(g=>g.group==='Documents');
  const view = chartView[groupKey];
  const findItem = key => { for(const g of groups) for(const it of g.items) if(it.key===key) return it; return null; };
  if(!findItem(view.base)) view.base = groups[0].items[0].key;

  const card=document.createElement('div'); card.className='chart';
  const h=document.createElement('h3');
  view.type = getPref('chart-'+groupKey, view.type);
  const sel=document.createElement('select'); sel.className='base sel';
  groups.forEach(g=>{ const og=document.createElement('optgroup'); og.label=g.group;
    g.items.forEach(it=>{ const o=document.createElement('option'); o.value=it.key; o.textContent=it.label; if(it.key===view.base) o.selected=true; og.appendChild(o); });
    sel.appendChild(og); });
  const toolbar=document.createElement('div'); toolbar.className='toolbar';
  toolbar.innerHTML=`<span class="seg" role="group" aria-label="Chart type"><button data-type="bar" data-key="${groupKey}">Bar</button><button data-type="pie" data-key="${groupKey}">Pie</button></span><button class="dl btn btn-secondary">⤓ PNG</button><button class="cp btn btn-secondary">⧉ Copy</button><span class="msg"></span>`;
  const chartHost=document.createElement('div');
  const draw=()=>{
    const it=findItem(view.base); const data=charts[it.key]||[];
    const colored=data.map((d,i)=>({...d, color: it.mode==='status'? statusColor(d.name) : (d.color||PALETTE[i%PALETTE.length])}));
    const tooMany=data.length>12; const type=(tooMany&&view.type==='pie')?'bar':view.type;
    h.textContent=it.label+(tooMany&&view.type==='pie'?' — pie hidden (too many categories)':'');
    chartHost.innerHTML=type==='pie'? pieSVG(it.label, colored) : barSVG(it.label, colored);
    toolbar.querySelectorAll('.seg button').forEach(b=> b.classList.toggle('on', b.dataset.type===type));
  };
  sel.onchange=()=>{ view.base=sel.value; draw(); };
  toolbar.querySelectorAll('.seg button').forEach(b=> b.onclick=()=>{ view.type=b.dataset.type; setPref('chart-'+groupKey, view.type); draw(); });
  attachExport(toolbar, ()=>chartHost.innerHTML, ()=> xp(findItem(view.base).label));
  const head=document.createElement('div'); head.className='head-actions'; head.appendChild(sel); head.appendChild(toolbar);
  card.appendChild(h); card.appendChild(head); card.appendChild(chartHost);
  host.appendChild(card);
  draw();
}

  if(scurveWin.from>n-1) scurveWin.from=n-1;
  if(scurveWin.from>scurveWin.to){ const t=scurveWin.from; scurveWin.from=scurveWin.to; scurveWin.to=t; }
  // Period-window controls live inline in the panel header (common .panel-head rule); the collapse
  // button is added by ensureCollapse into the same head-actions, so remove any prior copy first.
  const actions=document.getElementById('curveActions');
  const win=document.createElement('div'); win.className='toolbar sc-win';
  win.innerHTML=`<span class="lbl">Period window</span><label class="rng">From <input type="range" class="wf" min="0" max="${n-1}" value="${scurveWin.from}"></label><label class="rng">To <input type="range" class="wt" min="0" max="${n-1}" value="${scurveWin.to}"></label><button class="reset btn btn-secondary">Reset</button><span class="msg"></span>`;
  if(actions){ actions.querySelectorAll('.sc-win').forEach(e=>e.remove()); actions.appendChild(win); }
  const card=document.createElement('div'); card.className='chart';
  const head=document.createElement('div'); head.className='panel-head';
  const t=document.createElement('h3'); t.textContent='Issue Progress — cumulative S-curve + monthly bars'; head.appendChild(t);
  const tb=document.createElement('div'); tb.className='toolbar head-actions';
  tb.innerHTML=`<button class="dl btn btn-secondary">⤓ PNG</button><button class="cp btn btn-secondary">⧉ Copy</button><span class="msg"></span>`; head.appendChild(tb);
  const host=document.createElement('div'); host.className='curve-host';
  const leg=`<div class="legend"><span><i class="sw" style="background:${COLORS.blue}"></i>Planned</span><span><i class="sw" style="background:${COLORS.amber}"></i>Forecast</span><span><i class="sw" style="background:${COLORS.green}"></i>Actual</span><span style="color:#6b7785">— solid = cumulative · bars = monthly (shared axis)</span></div>`;
  card.appendChild(head); card.appendChild(host); card.insertAdjacentHTML('beforeend', leg);
  body.appendChild(card);
  const draw=()=>{ const a=scurveWin.from, b=scurveWin.to;
    host.innerHTML=combinedProgressSVG(progress,a,b);
    const msg=win.querySelector('.msg'); if(msg) msg.textContent=`${progress.months[a]} → ${progress.months[b]}  (${b-a+1}/${n} months)`; };
  win.querySelector('.wf').oninput=e=>{ scurveWin.from=+e.target.value; draw(); };
  win.querySelector('.wt').oninput=e=>{ scurveWin.to=+e.target.value; draw(); };
  win.querySelector('.reset').onclick=()=>{ scurveWin={from:0,to:n-1}; win.querySelector('.wf').value=0; win.querySelector('.wt').value=n-1; draw(); };
  if(progress.projStartLabel) body.insertAdjacentHTML('afterbegin', `<div class="curve-note">Project start: <b>${esc(progress.projStartLabel)}</b> — marked by the red dashed vertical line. Cumulative lines and monthly bars share one count axis.</div>`);
  attachExport(tb, ()=>host.innerHTML, xp('Issue_Progress'));
  draw();
}
const OVERDUE_COLS=[
  {h:'Prolog Number', f:'Prolog Number'},
  {h:'Document No.', f:'Document No.'},
  {h:'Number', f:'Number'},
  {h:'Document Title', f:'Document Title'},
  {h:'UESH Discipline', f:'UESH Discipline'},
  {h:'Overdue Type', f:null},
  {h:'Planned 1st Issue Date', f:'Planned 1st Issue Date'},
  {h:'Forecast 1st Issue Date', f:'Forecast 1st Issue Date'},
  {h:'Actual 1st Issue Date', f:'Actual 1st Issue Date'},
  {h:'Latest Approval Date', f:'Latest Approval Date'},
  {h:'Latest Approval Status', f:'Latest Approval Status'},
  {h:'Submission Status', f:'Submission Status'},
  {h:'Delay (days)', f:null, num:true}
];
const OVERDUE_TYPES=[
  {key:'first', label:'1st-submission'},
  {key:'sub', label:'Resubmission'},
  {key:'cli', label:'Client-review'}
];
function renderOverdue(panel, o){
  const rows=[];
  OVERDUE_TYPES.forEach(t=> (o[t.key]||[]).forEach(r=> rows.push({r, type:t.label})));
  rows.sort((a,b)=>{
    const da=a.r.fields['UESH Discipline']||'', db=b.r.fields['UESH Discipline']||'';
    if(da<db)return -1; if(da>db)return 1;
    if(a.type<b.type)return -1; if(a.type>b.type)return 1;
    const na=a.r.docNo||'', nb=b.r.docNo||''; return na<nb?-1:na>nb?1:0;
  });
  const colVal=(c,x)=>{
    if(c.f===null){ if(c.h==='Overdue Type') return x.type; if(c.h==='Delay (days)') return (x.r.delay==null?'':x.r.delay); }
    return x.r.fields[c.f]||'';
  };
  const head=`<thead><tr>${OVERDUE_COLS.map(c=>`<th scope="col">${esc(c.h)}</th>`).join('')}</tr></thead>`;
  const cells=x=>OVERDUE_COLS.map(c=>`<td${c.num?' class="num"':''}>${esc(colVal(c,x))}</td>`).join('');
  const tbody=tf=>{ const rs=rows.filter(x=>!tf||x.type===tf);
    return rs.length?rs.map(x=>`<tr class="over">${cells(x)}</tr>`).join(''):`<tr><td colspan="${OVERDUE_COLS.length}" class="empty">No overdue documents</td></tr>`; };
  panel.innerHTML=`<div class="panel-head">
      <h2>Overdue List</h2>
      <div class="head-actions">
        <label class="lbl">Overdue Type:
          <select class="base" id="ovType">
            <option value="">All</option>
            ${OVERDUE_TYPES.map(t=>`<option value="${t.label}">${t.label}</option>`).join('')}
          </select>
        </label>
        <button class="csv btn btn-secondary" id="ovCsv" title="Download consolidated overdue list as CSV">⤓ CSV</button>
        <span class="cnt" id="ovCnt">${rows.length} docs</span>
      </div>
    </div>
    <div class="tableScroll"><table class="ds-table">${head}<tbody id="ovBody">${tbody('')}</tbody></table></div>`;
  const sel=panel.querySelector('#ovType');
  sel.onchange=()=>{ panel.querySelector('#ovBody').innerHTML=tbody(sel.value); const c=panel.querySelector('#ovCnt'); if(c)c.textContent=rows.filter(x=>!sel.value||x.type===sel.value).length+' docs'; };
  panel.querySelector('#ovCsv').onclick=()=>{
    const tf=sel.value; const rs=rows.filter(x=>!tf||x.type===tf);
    const header=OVERDUE_COLS.map(c=>c.h);
    const lines=[header.join(',')].concat(rs.map(x=>OVERDUE_COLS.map(c=>colVal(c,x)).map(csvCell).join(',')));
    downloadCSV(xp('Overdue')+'.csv', lines.join('\n'));
  };
}
function renderValidation(panel, issues, model){
  const grouped={}; issues.forEach(i=>{ const g=grouped[i.code]||(grouped[i.code]={code:i.code,severity:i.severity,message:i.message,count:0,samples:[]}); g.count++; if(g.samples.length<5)g.samples.push(i); });
  const rows=Object.values(grouped).sort((a,b)=>b.count-a.count);
  panel.innerHTML=`<div class="panel-head"><h2>Validation Issues</h2>
      <div class="head-actions"><button id="vCsv" class="csv btn btn-secondary" title="Download validation issue list as CSV">⤓ CSV</button><span class="cnt" id="vCnt">${issues.length} issues</span></div></div>
    <div class="tableScroll"><table class="ds-table"><thead><tr><th scope="col">Error Code</th><th scope="col">Severity</th><th scope="col">Count</th><th scope="col">Rule (source: Code!AK)</th></tr></thead><tbody>
    ${rows.map(g=>`<tr><td>${esc(g.code)}</td><td class="sev-${g.severity==='Error'?'error':(g.severity==='Warning'?'warning':'info')}">${esc(g.severity)}</td><td class="num">${g.count}</td><td>${esc(g.message)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">${issues.length} issues across ${rows.length} rules. All wording &amp; severity sourced from the Code sheet Error block (Code!AI:AL) — none hard-coded.</div>`;
  panel.querySelector('#vCsv').onclick=()=>downloadCSV(xp('issue_list')+'.csv', issuesCSV(model, issues));
}
function renderDetail(panel, recs, model, state, rerender){
  const cols = model.contract.fieldOrder;
  const sr = state.sort;
  let rows = recs.slice();
  if(sr.col){ const idx=cols.indexOf(sr.col); rows.sort((a,b)=> (a.fields[sr.col]||'')<(b.fields[sr.col]||'')?-sr.dir:(a.fields[sr.col]||'')>(b.fields[sr.col]||'')?sr.dir:0); }
  panel.innerHTML=`<div class="panel-head"><h2>Document Detail Table</h2>
      <div class="head-actions"><button id="dCsv" class="csv btn btn-secondary" title="Download document list as CSV">⤓ CSV</button><span class="cnt" id="dCnt">${rows.length} docs</span></div></div>
    <div class="tableScroll"><table class="ds-table"><thead><tr><th scope="col">Source Tab</th><th scope="col">Active</th>${cols.map(c=>`<th scope="col" data-col="${esc(c)}">${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.sourceTab)}</td><td class="${r.isActive?'act':'ina'}">${r.isActive?'Y':'N'}</td>${cols.map(c=>{const val=r.fields[c]; const cls=statusPill(c,val); return `<td class="${cls}">${esc(val)}</td>`;}).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  panel.querySelectorAll('th[data-col]').forEach(th=>th.onclick=()=>{ const col=th.dataset.col; if(state.sort.col===col)state.sort.dir*=-1; else state.sort={col,dir:1}; rerender(); });
  panel.querySelector('#dCsv').onclick=()=>downloadCSV(xp('document_list')+'.csv', docsCSV(model, recs));
}
function statusPill(field, val){
  if(field==='Latest Approval Status'){ return ({APP:'p-app',AWC:'p-awc',REJ:'p-rej',NAP:'p-nap'})[val]||''; }
  if(field==='Submission Status'){ return ({SUR:'p-sur',RTR:'p-rtr',NTS:'p-nts'})[val]||''; }
  return '';
}

// ---------- CSV ----------
function csvCell(v){ const s=v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function issuesCSV(model, issues){ const head=['Error Code','Severity','Message','Doc No','Discipline','Source Tab','Row'];
  const lines=[head.join(',')]; issues.forEach(i=>lines.push([i.code,i.severity,i.message,i.docNo,i.discipline,i.sourceTab,i.rownum].map(csvCell).join(','))); return lines.join('\n'); }
function docsCSV(model, recs){ const cols=model.contract.fieldOrder; const head=['Source Tab','Active',...cols];
  const lines=[head.join(',')]; recs.forEach(r=>lines.push([r.sourceTab,r.isActive?1:0,...cols.map(c=>r.fields[c])].map(csvCell).join(','))); return lines.join('\n'); }
function downloadCSV(name, text){ const b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
const projPrefix = () => { const n=(MODEL&&MODEL.meta&&MODEL.meta.workbookName)||'MDL'; return n.replace(/\.(xlsx|xlsm)$/i,''); };
const xp = b => projPrefix() + '-' + b;

// ---------- boot / welcome ----------
function boot(root){
  const year = new Date().getFullYear();
  root.innerHTML = `<style>${CSS}</style>
  <div class="welcome-screen"><div class="welcome">
    <img class="wlogo" src="${LOGO_DATA}" alt="logo">
    <h1>Master Document List Dashboard</h1>
    <p class="sub">Interactive dashboard. Load the workbook to validate data, explore status and details.</p>
    <div class="expect"><b>What this does</b> — Select your Code-sheet workbook (.xlsx)… Drop it below or click to browse.</div>
    <div class="drop">
      <div class="d-title">Drop your workbook here</div>
      <div class="d-sub">or click to browse</div>
      <label class="btn btn-primary">Choose Workbook<input type="file" id="file" accept=".xlsx,.xlsm" style="display:none"></label>
      <div id="err" class="err"></div>
    </div>
    <div class="privacy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 3 5v6c0 5 3.4 9.7 9 11 5.6-1.3 9-6 9-11V5l-9-4zm0 10.9h7c-.5 4-3 7.3-7 8.3V12H5V6.3l7-3.1V12z"/></svg> Works fully offline — your data never leaves this browser</div>
    <div class="copyright">© ${year} UESH</div>
  </div></div>`;
  const input = root.querySelector('#file');
  const drop = root.querySelector('.drop');
  const loadFile = async f => {
    if(!f) return;
    try{
      const buf = await f.arrayBuffer();
      const wb = await readXlsx(buf);
      const model = buildModel(wb, { workbookName: f.name });
      renderDashboard(root, model);
    }catch(err){ const el = root.querySelector('#err'); if(el) el.textContent = 'Failed to parse workbook: ' + err.message; console.error(err); }
  };
  input.onchange = e => { const f = e.target.files[0]; if(f) loadFile(f); };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.add('hover'); }));
  ['dragleave','dragend'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('hover'); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) loadFile(f); });
}


boot(document.getElementById("app"));

</script>
