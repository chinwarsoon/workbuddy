 * with warm amber), not hue-shifted copies of one dark theme. contrast is kept for maximum legibility.
 *
 *

 * Revision 1.3.0 | 2026-11-28 | AWS Quick (AI) | User-reported crosshair regression + 20-point contract — added
 * --crosshair-faint/-medium/-strong: a true 3-tier color-mix(..., transparent) ladder (NOT mixed toward
 * a surface token, which produced an opaque fill). light/sky/contrast use 7/13/17%; dark/ocean/presentation
 * use 12/20/26% (darker themes need a higher percentage for the same visual strength). All 18 values
 * verified >= 4.5:1 text contrast against both --surface and --ds-zebra before writing.
 * Revision 1.2.0 | 2026-11-28 | AWS Quick (AI) | C-08 — added --pchip-* (4 families x 3 roles, migrated

/* ===== common/welcome/welcome.css (welcome 1.4.1) ===== */
/* common/welcome/welcome.css
 * Revision 1.3.1 | 2026-11-28 | AWS Quick (AI) | Test fixes: dropped the literal rgba() border on .cw-theme-dot for
 * var(--border); renamed .is-active -> .cw-is-active to satisfy the .cw- class-prefix test.
 * Revision 1.3.0 | 2026-11-28 | AWS Quick (AI) | C-08 — theme-picker styles for welcome.mjs 1.4.0: .cw-topbar-actions,
 * .cw-theme (button, dot, dropdown menu). See AGENTS.md §18.4 rev 2026-11-28.
 * Revision 1.2.0 | 2026-11-27 | AWS Quick (AI) | C-06 — spec §3.7 rev 1.111: two-column card. Top bar (logo, Help);
 * navy guide panel left (title, description, three steps, check list) and task panel right (heading, instruction,
 * fixed-height drop box, file list, action row, footer), split 1 : 1.618. The card height is fixed by the columns
 * (--welcome-card-h, 600 px: the card is about 709 px high and fits a 1280 × 720 screen), so it does not change
 * between states. Columns stack below 900 px wide; below 700 px high the row height is released; the screen then scrolls.
 * Revision 1.1.0 | 2026-11-27 | AWS Quick (AI) | C-05 — fixed-height single column (superseded by 1.2.0).
 * Build-time only (AGENTS.md §3). Classes use the .cw- prefix. Theme tokens with fallbacks to tokens that all three
 * dashboards define. No literal colour and no min-height in component rules (§3.7.9).
 */
:root{
  --welcome-card-w:clamp(880px,72vw,1040px);
  --welcome-card-h:600px;
  --welcome-card-radius:16px;
  --welcome-logo-h:36px;
  --welcome-drop-h:228px;
  --welcome-gap:12px;
  --welcome-slot-h:36px;
  --welcome-left-bg:var(--navy);
  --welcome-left-fg:var(--surface);
  --welcome-left-line:var(--slate,var(--muted));
  --cw-ok-bg:var(--success-bg,var(--ok-bg,var(--soft)));
  --cw-ok-fg:var(--success,var(--ok-fg,var(--green)));
  --cw-err-bg:var(--danger-bg,var(--error-bg,var(--soft)));
  --cw-err-fg:var(--danger,var(--error-fg,var(--red)));
  --cw-wait-fg:var(--warning,var(--amber,var(--blue)));
}
.cw-screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;overflow:auto;background:var(--bg);color:var(--text);font-family:var(--font-ui,var(--font,system-ui,-apple-system,'Segoe UI',sans-serif))}
.cw-screen[hidden]{display:none}
.cw-center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.cw-card{width:var(--welcome-card-w);max-width:100%;display:grid;grid-template-rows:auto var(--welcome-card-h);background:var(--surface);border:1px solid var(--border);border-radius:var(--welcome-card-radius);box-shadow:var(--shadow);overflow:hidden}
/* top bar */
.cw-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 28px;border-bottom:1px solid var(--border)}
.cw-brand{display:flex;align-items:center;gap:10px;min-width:0}
.cw-logo{height:var(--welcome-logo-h);width:auto;flex:none;border-radius:6px}
.cw-brand-t b{display:block;font-size:17px;line-height:1.1;color:var(--navy)}
.cw-brand-t small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3,var(--muted))}
.cw-help{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 2px;color:var(--blue);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.cw-help:hover{text-decoration:underline}
.cw-help:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.cw-help-ic{width:18px;height:18px;border:1.5px solid var(--blue);border-radius:50%;display:grid;place-items:center;font-size:11px;line-height:1}
/* two columns 1 : 1.618 */
.cw-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.618fr);height:100%;overflow:hidden}
/* left: guide panel */
.cw-left{display:flex;flex-direction:column;overflow:hidden;padding:36px 32px 28px;background:var(--welcome-left-bg);color:var(--welcome-left-fg)}
.cw-title{margin:0;font-size:26px;line-height:1.2;font-weight:700;color:inherit}
.cw-desc{margin:12px 0 0;font-size:14px;opacity:.78}
.cw-steps{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.cw-step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;opacity:.72}
.cw-step b{display:block;font-size:14px}
.cw-step-d{display:block;font-size:12.5px;opacity:.82}
.cw-step-n{width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:700}
.cw-step.is-now{opacity:1}.cw-step.is-now .cw-step-n{background:var(--welcome-left-fg);color:var(--welcome-left-bg);border-color:var(--welcome-left-fg)}
.cw-step.is-done{opacity:1}.cw-step.is-done .cw-step-n{background:var(--cw-ok-fg);border-color:var(--cw-ok-fg);color:var(--surface)}

.ds-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);table-layout:fixed}
.ds-table th,.ds-table td{border-bottom:1px solid var(--border);padding:9px 10px;text-align:left;vertical-align:top}
.ds-table thead th{background:var(--thead-bg,var(--navy));color:var(--thead-fg,var(--on-fill));font-size:12px;font-weight:600}
.ds-table th[scope="row"]{font-weight:400}
.ds-table .num{text-align:right;font-variant-numeric:tabular-nums}
.ds-table .enum{text-align:center}
.ds-table .doc-full{white-space:nowrap;overflow:visible;text-overflow:clip}
.ds-table tbody tr:nth-child(even){background:var(--ds-zebra)}
.ds-table tbody tr:hover{background:var(--soft)}
.ds-table .empty{color:var(--muted);text-align:center}
/* === §7.2.3 / §7.2.5 grid discipline — ROLLED OUT GLOBALLY (I-90, from the Rule
   Reference pilot). Row height is ENFORCED by the token rather than left to content
   (RC-8); cells are nowrap + ellipsis so a long value never grows a row (RC-5); and
   <code> inherits the cell font (RC-5). Column widths come from each table's <colgroup>. */
.ds-table th,.ds-table td{
  height:var(--ds-row-h);line-height:var(--ds-cell-lh);font-size:var(--ds-cell-fs);
  vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-table code{font:inherit}
/* §7.2.2 — column edges: a 1 px rule on the right edge of every header cell. Constant
   width; colour only on hover. Suppressed on grouped-header cells (colspan) and on the
   last data column / gutter so no rule hangs past the table's edge (§7.2.2 (b)). */
.ds-table thead th::after{content:"";position:absolute;top:8px;bottom:8px;right:0;
  width:var(--ds-rule-w);background:var(--ds-head-rule);pointer-events:none}
.ds-table thead th:hover::after{background:var(--ds-head-rule-hi)}
.ds-table thead th[colspan]::after{display:none}
.ds-table thead th:last-child:not(.ds-gut)::after{display:none}
.ds-table thead th.ds-gut::after{display:none}
/* §7.2.2 — the Discipline Summary Matrix paints a column rule on EVERY header cell, including the
   grouped (first) row and the final data column, so no header group reads as one continuous block.
   The gutter stays exempt. Enforced by harness Tier 4g. (Regression: MDL I-108.) */
.matrix thead th[colspan]::after{display:block}
.matrix thead th:last-child:not(.ds-gut)::after{display:block}
/* §7.2.6 — L2 sortable header. The button inherits the navy/white header; the label
   truncates but the indicator (flex:0 0 auto) stays visible at the cell's right edge. */
.ds-table thead th .sort-btn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;
  cursor:pointer;display:flex;align-items:center;gap:4px;width:100%;text-align:left}
.ds-table thead th .sort-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:2px}
.ds-table thead th .sort-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ds-table thead th .sort-ind{flex:0 0 auto;font-size:9px;line-height:1;opacity:.6;margin-left:auto}
.ds-table thead th[aria-sort="none"] .sort-ind{opacity:.3}
/* numeric (right-aligned) headers: the label + glyph group reads right-aligned as a unit (I-102) */
.ds-table thead th.num .sort-btn{justify-content:flex-end}
.ds-table thead th[aria-sort="ascending"] .sort-ind,.ds-table thead th[aria-sort="descending"] .sort-ind{opacity:1}
/* === §7.2.3 row typography tokens — one size, one line-height, one row height === */
:root{--ds-row-h:40px;--ds-head-h:40px;--ds-cell-fs:12px;--ds-cell-lh:20px;--ds-rule-w:1px;--ds-head-rule:rgba(255,255,255,.38);--ds-head-rule-hi:rgba(255,255,255,.7)}
/* === §7.2.3 / §7.2.5 grid discipline — ROLLED OUT GLOBALLY (I-90) ===
   The width/row-height/ellipsis/column-rule behaviour above is now on .ds-table itself.
   The severity chip went global in I-91 (it is now on an inner <span> in every table, not
   bound to <td>), so only the split-header (.vheadtab), the title band (.vrefhead) and the
   gutter column stay Rule-Reference-only. */
.sev-svg{width:14px;height:14px;flex:0 0 14px;display:block}
.note{background:var(--warn-bg);border:1px solid var(--amber);color:var(--warn-fg);padding:8px 12px;border-radius:8px;font-size:12px;margin:10px 0}
.panel-error{background:var(--error-bg);border:1px solid var(--error-fg);color:var(--error-fg);padding:12px 14px;border-radius:8px;font-size:12px;margin:8px 0;line-height:1.5}
.pe-detail{display:block;margin-top:6px;font-size:11px;opacity:.85}
.sb-err{border-color:var(--error-fg)}
.expand{cursor:pointer;color:var(--blue);font-size:10px;white-space:nowrap;user-select:none;border:0;background:transparent;padding:0;font-family:inherit}
.expand.open{color:var(--navy);font-weight:600}

.matrix{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface)}
.matrix th,.matrix td{border-bottom:1px solid var(--border);padding:4px 8px;text-align:center;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead tr.group th{background:var(--thead-bg,var(--navy));color:var(--thead-fg,var(--on-fill));font-weight:700}
.matrix thead tr.group th.tint{background:var(--warn-bg);color:var(--warn-fg)}
.matrix th.tint{background:var(--warn-bg);color:var(--warn-fg)}
.matrix td.col-tint{background:var(--warn-bg)}
.matrix tfoot td{background:var(--bg);font-weight:700;border-top:2px solid var(--navy)}
.matrix tbody tr:nth-child(even){background:var(--ds-zebra)}
.matrix tbody tr.sub{background:var(--soft)}
.matrix tbody tr.sub td.subname{text-align:left;padding-left:22px;color:var(--muted);font-style:italic}
.matrix td.noexp{color:var(--muted);text-align:center}
/* matrix split-header fragment (I-101): the header lives outside the scroller, always visible,
   never sticky — the scrollbar sits under it, not beside it */
/* The matrix fragment inherits the shared .splitcard contract (margin, width, position:relative and
   bottom rule) — position MUST stay relative: it is the containing block for the ::after column rule.
   Alignment needs NO positional rule: §18 centres every data column of a summary cross-tab and keeps the
   leading label column left, which the existing .matrix cell rule and its :first-child override already do
   — and because it comes from the column, header and body cannot drift apart. */
.matrix td{font-variant-numeric:tabular-nums}
/* §18: a summary cross-tab centres every data column. The type class (.num, right) and the
   :first-child override (left) are positional/type rules that can grab the WRONG cell here — the leaf
   row has no Discipline cell (it is rowspanned on the group row), so its first child is a data column
   and centres like the rest, and no leaf cell may be pulled right by .num. */
.matrix thead tr.detail th{text-align:center}
/* centred header: the label centres in the space left of the sort glyph, which stays pinned right.
   Discipline is the one column that reads left, with its data. */
.matrix thead th .sort-lbl{flex:1 1 auto;text-align:center}
.matrix thead tr.group th:first-child .sort-lbl{text-align:left}
#matrixPanel .matrixcard{overflow:hidden}
#matrixPanel .tableScroll{max-height:none}
.ds-table[data-table-crosshair] th:not(.ds-pinned),.ds-table[data-table-crosshair] td:not(.ds-pinned){position:relative}
/* Crosshair v2 (user-specified 20-point contract, 2026-11-28): background-color (true alpha, NOT
   background-image) so the tint blends with whatever the row already painted (zebra, selection,
   status colour) instead of replacing it. Exactly 3 tiers: faint (row/col) < medium (headers) <
   strong (active cell), each color-mix(in srgb, var(--accent) N%, transparent) so it is always
   theme's own accent at a theme-appropriate opacity (--crosshair-faint/-medium/-strong, defined
   per theme in common/tokens/tokens.css). No transition — response must be instant (<=80ms rule). */
.ds-table[data-table-crosshair] tbody tr.row-hover > td,.ds-table[data-table-crosshair] td.col-hover{background-color:var(--crosshair-faint)}
.ds-table[data-table-crosshair] td.cell-hover{background-color:var(--crosshair-strong);box-shadow:inset 0 0 0 2px var(--crosshair-ring)}
.ds-table[data-table-crosshair] th.col-hover{background-color:var(--crosshair-medium);font-weight:700;box-shadow:inset 0 -2px 0 var(--header-crosshair-accent)}
.ds-table[data-table-crosshair] th.cell-hover{background-color:var(--crosshair-medium);font-weight:700;box-shadow:inset 0 0 0 2px var(--crosshair-ring),inset 0 -2px 0 var(--header-crosshair-accent)}
.ds-table[data-table-crosshair] th.rowhead-hover{background-color:var(--crosshair-medium);font-weight:700;box-shadow:inset -2px 0 0 var(--header-crosshair-accent)}
.curve-card .curve-c1-table tbody th.g-label.rowhead-hover{background-color:var(--crosshair-medium);font-weight:700;box-shadow:inset -2px 0 0 var(--header-crosshair-accent)}
.ds-table[data-table-crosshair] :focus-visible{outline:2px solid var(--crosshair-ring);outline-offset:-2px}

.tableScroll thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--border)}
/* === L3 grid (I-95, spec §7.2.13 / §7.2.14) — pinned columns ===
   z-index ladder (§7.2.13): plain td (auto) < pinned td (1) < sticky header th (2) <
   pinned header th (4) < resize grip (5). The pinned cell carries an OPAQUE background
   and re-declares the zebra / hover colours, otherwise scrolled content shows through. */
.ds-table td.ds-pinned{position:sticky;background:var(--surface)}
/* Pinned HEADER cells must keep the navy header fill, not a white one — otherwise the
   inherited white header text (th{color:#fff}) becomes white-on-white (MDL I-105). */
.ds-table th.ds-pinned{position:sticky;background:var(--navy)}
.ds-table td.ds-pinned{z-index:1}
.ds-table thead th.ds-pinned{z-index:4}
.ds-table td.ds-pinned{box-shadow:1px 0 0 var(--border)}
.ds-table td.ds-pinned-edge{box-shadow:1px 0 0 var(--border),4px 0 10px -4px rgba(15,30,50,.28)}
.ds-table tbody tr:nth-child(even) td.ds-pinned{background:var(--ds-zebra)}
.ds-table tbody tr:hover td.ds-pinned{background:var(--soft)}
.ds-table[data-table-crosshair] tbody tr.row-hover > td.ds-pinned,.ds-table[data-table-crosshair] td.ds-pinned.col-hover{background-image:linear-gradient(var(--crosshair-faint),var(--crosshair-faint))}
.ds-table[data-table-crosshair] td.ds-pinned.cell-hover{background-image:linear-gradient(var(--crosshair-strong),var(--crosshair-strong));box-shadow:1px 0 0 var(--border),inset 0 0 0 2px var(--crosshair-ring)}
.ds-table[data-table-crosshair] tbody tr.row-hover > td.ds-pinned.cell-hover{background-image:linear-gradient(var(--crosshair-strong),var(--crosshair-strong));box-shadow:1px 0 0 var(--border),inset 0 0 0 2px var(--crosshair-ring)}
/* column resize grip (I-95, §7.2.13): 6 px wide, ≥24 px hit area via the padded edge */
.ds-resize{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;touch-action:none;z-index:5;border:0;background:transparent;padding:0}
.ds-resize::after{content:"";position:absolute;top:8px;bottom:8px;right:3px;width:2px;background:transparent;border-radius:1px}
.ds-resize:hover::after,.ds-resize.active::after{background:var(--accent)}
/* windowed rendering (I-96, §7.2.8): spacer rows keep the scrollbar length identical */
.ds-table tr.win-pad td{padding:0;border:0;background:transparent;overflow:hidden}
/* §7.10 B7 — COLUMN-VISIBILITY CHOOSER (I-114). This is a LAYOUT control, not a filter: it changes
   which columns are painted and never which rows are returned. It therefore gets its OWN classes
   (.cc-wrap / .cc-btn / .cc-panel) instead of borrowing the filter-trigger look (.tf-*), so it can
   never be mistaken for a row filter. It deliberately carries no count badge and no [aria-expanded]
   active-filter emphasis — the two cues that say "this narrows your rows". */
.cc-wrap{position:relative;flex-shrink:0}
.cc-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--navy);padding:7px 12px;min-height:32px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.cc-btn:hover{background:var(--soft)}
.cc-panel{position:absolute;top:calc(100% + 6px);right:0;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);min-width:260px;max-width:min(420px,92vw);max-height:380px;overflow:auto;padding:10px}
.cc-panel[hidden]{display:none}
.cc-panel .cc-row{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:12px}
.cc-panel .cc-row input{flex:0 0 auto}
.cc-panel .cc-row .cc-lbl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-panel .cc-row .cc-pin{font-size:10px;color:var(--muted);flex:0 0 auto}
.cc-panel .cc-row input:disabled+ .cc-lbl{color:var(--muted)}
/* I-115 — the chooser adopts the SAME internal ordering as .tf-panel: master "All columns"
   → note → divider → items → footer. Only the class names differ (§7.10 B7): a layout control
   still gets no count badge and no active-filter emphasis, so it cannot be read as a filter. */
.cc-panel .cc-all{display:flex;align-items:center;gap:8px;padding:2px;font-size:12px;cursor:pointer}
.cc-panel .cc-all input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0}
.cc-panel .cc-all .cc-lbl{flex:1 1 auto;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-panel .cc-note{margin:2px 2px 6px;font-size:10px;color:var(--muted);line-height:1.35}
.cc-panel .cc-divider{height:1px;background:var(--border);margin:0 0 6px}
.cc-panel .cf-foot{display:flex;align-items:center;gap:8px;padding:8px 2px 2px;margin-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.cc-panel .cf-foot .cf-cnt{margin-left:auto}
.cc-panel .cf-foot button{font:inherit;font-size:11px;color:var(--accent);background:transparent;border:0;padding:0;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.cc-panel .cf-foot button:hover{text-decoration:underline}
.cnt{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}


.hidden{display:none}
/* I-136 — Issue Progress C1 attached table. All selectors stay inside .curve-card. */
.curve-card{gap:2px}
.curve-card .chart-actions{gap:var(--tool-gap);margin-bottom:8px}
.curve-card .sc-win{flex:0 0 auto;justify-content:flex-start;width:100%;min-width:0;margin-bottom:0}
.curve-card .sc-win .msg{margin-left:0;flex-shrink:0}
.curve-card .c1-ts-body{position:relative;display:flex;flex:1 1 190px;min-width:120px;max-width:440px;height:26px;align-items:center}
.curve-card .c1-timebar{--c1-thumb:14px;position:relative;flex:1;height:26px}
.curve-card .c1-track{position:absolute;left:calc(var(--c1-thumb)/2);right:calc(var(--c1-thumb)/2);top:12px;height:4px;border-radius:2px;background:var(--border)}
.curve-card .c1-fill{position:absolute;top:12px;height:4px;border-radius:2px;background:var(--blue);pointer-events:none;left:var(--c1-fill-left,calc(var(--c1-thumb)/2));width:var(--c1-fill-width,0px)}
.curve-card .c1-ticks{position:absolute;inset:0;pointer-events:none}
.curve-card .c1-tick{position:absolute;top:9px;width:1px;height:6px;background:var(--border)}
.curve-card .c1-tick.is-year{top:7px;height:10px;background:var(--text2)}
.curve-card .c1-tick.is-active{background:var(--blue)}
.curve-card .c1-tick.is-near{top:6px;height:12px;background:var(--blue)}
.curve-card .c1-year{position:absolute;top:-12px;left:0;transform:translateX(-50%);font-size:9px;color:var(--text2);white-space:nowrap}
.curve-card .c1-timebar input[type=range]{position:absolute;left:0;top:0;width:100%;height:26px;margin:0;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none}
.curve-card .c1-timebar input[type=range]::-webkit-slider-runnable-track{height:26px;background:transparent;border:0}
.curve-card .c1-timebar input[type=range]::-moz-range-track{height:26px;background:transparent;border:0}
.curve-card .c1-timebar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--c1-thumb);height:var(--c1-thumb);margin-top:6px;border-radius:50%;background:var(--blue);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--blue);cursor:grab;pointer-events:auto;transition:transform .12s ease}
.curve-card .c1-timebar input[type=range]::-moz-range-thumb{width:var(--c1-thumb);height:var(--c1-thumb);border-radius:50%;background:var(--blue);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--blue);cursor:grab;pointer-events:auto;transition:transform .12s ease}
.curve-card .c1-timebar input[type=range]:active::-webkit-slider-thumb,.curve-card .c1-timebar input[type=range]:active::-moz-range-thumb{transform:scale(1.15);cursor:grabbing}
.curve-card .c1-timebar input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.curve-card .c1-timebar input.wf{z-index:3}
.curve-card .c1-timebar input.wt{z-index:4}
.curve-card .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
.curve-card .seg-btn{min-height:var(--seg-h);padding:var(--seg-pad-y) var(--seg-pad-x);font:var(--seg-fw) var(--seg-fs)/var(--seg-lh) var(--font-ui);border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer}
.curve-card .seg-btn:last-child{border-right:0}
.curve-card .seg-btn.active{background:var(--seg-active-bg);color:var(--seg-active-fg)}
.curve-card .seg-btn.active:hover{background:var(--seg-active-bg);color:var(--seg-active-fg)}
.curve-card .seg-btn:not(.active):not(:disabled):hover{background:var(--seg-hover-bg);color:var(--seg-hover-fg)}
.curve-card .seg-btn:not(:disabled):active:not(.active){background:var(--seg-pressed-bg);color:var(--text)}
.curve-card .seg-btn:focus-visible{outline:2px solid var(--seg-focus);outline-offset:-2px}
.curve-card .seg-btn.active:focus-visible{outline-color:var(--seg-focus-on-active)}
.curve-card .curve-host{width:100%;overflow-x:visible}
.curve-card .curve-c1-grid{--c1-gutter:104px;--c1-right-w:52px;display:grid;grid-template-columns:var(--c1-gutter) repeat(var(--c1-cols),minmax(0,1fr));column-gap:0;row-gap:var(--c1-plot-table-gap);align-items:stretch;min-width:0;width:100%}
.curve-card .curve-c1-gutter{grid-column:1;grid-row:1;position:relative;border:1px solid var(--border);border-right:0;border-radius:10px 0 0 10px;background:var(--surface)}
.curve-card .curve-c1-yticks{position:absolute;inset:0;pointer-events:none}
.curve-card .curve-c1-ytick{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--font-ui);font-size:13px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--text2);white-space:nowrap}
.curve-card .curve-c1-ycap{position:absolute;left:2px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--font-ui);font-size:11px;font-weight:700;line-height:1;color:var(--text2);white-space:nowrap}
.curve-card .curve-c1-plot{grid-column:2/-1;grid-row:1;position:relative;min-width:0;cursor:crosshair;border:1px solid var(--border);border-radius:0 10px 10px 0;background:var(--surface);overflow:visible}
.curve-card .curve-c1-plot:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.curve-card .curve-c1-plot svg{display:block;width:100%;height:auto;overflow:visible}
.curve-card .curve-c1-table{grid-column:1/-1;grid-row:2;width:100%;min-width:0;table-layout:fixed;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:10px;margin:0}
.curve-card .curve-c1-table caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.curve-card .curve-c1-table th,.curve-card .curve-c1-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--surface)}
.curve-card .curve-c1-table tbody tr:nth-child(even) td{background:var(--ds-zebra)}
.curve-card .curve-c1-table tr>*:last-child{border-right:0}
.curve-card .curve-c1-table tbody tr:last-child>*{border-bottom:0}
.curve-card .curve-c1-table thead th{background:var(--thead-bg,var(--navy));color:var(--thead-fg,var(--on-fill))}
.curve-card .curve-c1-table thead th.corner{text-align:left;color:var(--thead-fg,var(--on-fill));font-size:10px;font-weight:700}
.curve-card .curve-c1-table thead th.g-axis,.curve-card .curve-c1-table thead th.g-label{font-size:11px;font-weight:600;color:var(--thead-fg,var(--on-fill));white-space:nowrap}
.curve-card .curve-c1-table tbody th.g-label{text-align:left;background:var(--surface2);color:var(--text2);font-size:11px;font-weight:600}
.curve-card .curve-c1-table thead th.g-axis span{display:inline-block;writing-mode:horizontal-tb;white-space:nowrap}
.curve-card .curve-c1-table.c1-many thead th.g-axis{height:88px;padding:2px}
.curve-card .curve-c1-table.c1-many thead th.g-axis span{writing-mode:vertical-rl;text-orientation:mixed}
.curve-card .curve-c1-table [data-c1col]:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.curve-card .curve-c1-table td.col-active,.curve-card .curve-c1-table th[scope=row].col-active{background-color:var(--crosshair-faint);font-weight:700}
.curve-card .curve-c1-table th[data-c1col].col-active{background-color:var(--crosshair-medium);font-weight:700;box-shadow:inset 0 -2px 0 var(--header-crosshair-accent)}
@media (hover:hover) and (pointer:fine){
.curve-card .curve-c1-table td.cell-hover,.curve-card .curve-c1-table th[scope=row].cell-hover{background-color:var(--crosshair-strong);box-shadow:inset 0 0 0 2px var(--crosshair-ring)}

  const fill = (s, p) => String(s).replace(/\{(\w+)\}/g, (_, k) => String(p[k] ?? ''));

  /**
   * Check a welcome configuration against the §3.7.2 rules (schema subset, no dependency).
   * @param {object} cfg welcome configuration
   * @returns {string[]} problems; empty when valid
   */
  function validateConfig(cfg) {
    const e = [];
    if (!cfg || typeof cfg !== 'object') return ['config is not an object'];
    for (const k of ['title', 'instruction', 'help']) if (!cfg[k] || typeof cfg[k] !== 'string') e.push(`${k} is required`);
    if (!Array.isArray(cfg.files) || !cfg.files.length) e.push('files[] needs at least one entry');
    else {
      if (cfg.files.length > MAX_FILES) e.push(`files[] allows at most ${MAX_FILES} entries (spec §3.7.2 rev 1.110)`);
      cfg.files.forEach((f, i) => { if (!f.key || !f.name || !f.dashboardTitle) e.push(`files[${i}] needs key, name and dashboardTitle`); });
      if (new Set(cfg.files.map(f => f.key)).size !== cfg.files.length) e.push('files[].key must be unique');
      if (new Set(cfg.files.map(f => f.dashboardTitle)).size !== cfg.files.length) e.push('files[].dashboardTitle must be unique');
      const want = cfg.files.length === 1 ? 'auto' : 'confirm';
      if (cfg.mode !== want) e.push(`mode must be "${want}" for ${cfg.files.length} file(s)`);
    }
    if (cfg.successHoldMs !== undefined && !(Number.isInteger(cfg.successHoldMs) && cfg.successHoldMs >= 0 && cfg.successHoldMs <= HOLD_MAX)) e.push(`successHoldMs must be an integer 0–${HOLD_MAX}`);
    if (cfg.doneDwellMs !== undefined && !(Number.isInteger(cfg.doneDwellMs) && cfg.doneDwellMs >= 0 && cfg.doneDwellMs <= DWELL_MAX)) e.push(`doneDwellMs must be an integer 0–${DWELL_MAX}`);
    if (cfg.logo?.src && !/^data:/.test(cfg.logo.src)) e.push('logo.src must be a data: URI (spec §3.9)');
    if (cfg.checks !== undefined && !(Array.isArray(cfg.checks) && cfg.checks.length <= 5 && cfg.checks.every(x => typeof x === 'string' && x))) e.push('checks[] must hold 0–5 non-empty strings (spec §3.7.3 rev 1.111)');
    if (cfg.description !== undefined && typeof cfg.description !== 'string') e.push('description must be a string');
    if (cfg.themePicker !== undefined) {
      const tp = cfg.themePicker;
      if (!Array.isArray(tp.themes) || !tp.themes.length) e.push('themePicker.themes[] must hold at least one entry');
      else if (tp.themes.some(x => !x.key || !x.label || !x.dot)) e.push('themePicker.themes[] entries need key, label and dot');
      if (tp.current && !(tp.themes || []).some(x => x.key === tp.current)) e.push('themePicker.current must match a themes[].key');
    }
    return e;
  }

  /**
   * Pure state reducer for the welcome. Exported for Node tests.
   * @param {object} s current state
   * @param {object} a action {type, ...}
   * @returns {object} next state
   */
  function reduce(s, a) {
    const slots = { ...s.slots };
    switch (a.type) {
      case 'checking': for (const k of a.keys) slots[k] = { state: 'checking' }; return { ...s, slots, alert: '' };
      case 'accept': slots[a.key] = { state: 'accepted', fileName: a.fileName, dashboardTitle: a.dashboardTitle, projectTitle: a.projectTitle }; return { ...s, slots };
      case 'reject': slots[a.key] = { state: 'rejected', fileName: a.fileName, reason: a.reason }; return { ...s, slots };
      case 'remove': slots[a.key] = { state: 'needed' }; return { ...s, slots, alert: '', ignored: [], picked: 0, used: 0 };
      case 'restore': return { ...s, slots: { ...a.slots }, alert: a.alert || '', ignored: a.ignored || [], picked: a.picked || 0, used: a.used || 0 };
      case 'phase': return { ...s, view: 'loading', phase: a.index, failed: null, alert: '', ignored: [] };
      case 'fail': return { ...s, view: 'slots', phase: a.index, failed: a.index, alert: a.reason, retry: true };
      case 'ready': return { ...s, view: 'ready', phase: a.phases };
      case 'done': return { ...s, view: 'done' };
      default: return s;
    }
  }

  /**
   * Decide what a picked set of files does to the slots (§3.7.5 rev 1.110, C-04). Pure; exported for tests.
   * A file goes only to the slot of its own type (by Dashboard Title). A failed file marks a slot only
   * when its type is known and that slot is not already accepted (in auto mode: the one slot). Every
   * other failed or unrequired file is ignored and listed in the summary; it never changes a slot.
   * @param {object} cfg welcome configuration
   * @param {{file:{name:string}, r:{ok:boolean, dashboardTitle?:string, projectTitle?:string, reason?:string}}[]} results
   * @param {object} beforeSlots slots before this pick
   * @param {object} [L] labels
   * @returns {{setError:string}|{slots:object, accepted:object, ignored:{file:string,reason:string}[], used:number, picked:number}}
   */
  function plan(cfg, results, beforeSlots, L = DEFAULT_LABELS) {
    const multi = cfg.files.length > 1;
    const typed = results.map(x => {
      const f = x.r.dashboardTitle ? cfg.files.find(c => c.dashboardTitle === x.r.dashboardTitle) || null : null;
      const r = x.r.ok && !f ? { ...x.r, ok: false, reason: fill(L.noMatch, { title: x.r.dashboardTitle }) } : x.r;
      return { file: x.file, r, f };
    });
    const ok = typed.filter(x => x.r.ok);
    const keys = ok.map(x => x.f.key);
    const dup = keys.findIndex((k, i) => keys.indexOf(k) !== i);
    if (dup >= 0) return { setError: fill(L.duplicate, { title: ok[dup].r.dashboardTitle }) };
    const slots = { ...beforeSlots }, accepted = {};
    for (const x of ok) { slots[x.f.key] = { state: 'accepted', fileName: x.file.name, dashboardTitle: x.r.dashboardTitle, projectTitle: x.r.projectTitle }; accepted[x.f.key] = x.file; }
    const projects = [...new Set(Object.values(slots).filter(v => v.state === 'accepted').map(v => v.projectTitle).filter(Boolean))];
    if (projects.length > 1) return { setError: fill(L.projectMismatch, { a: projects[0], b: projects[1] }) };
    const ignored = [], rejectedNow = new Set();
    for (const x of typed.filter(y => !y.r.ok)) {
      const target = multi ? x.f : cfg.files[0];
      const reason = x.r.reason || L.unreadable;
      if (target && slots[target.key].state !== 'accepted' && !rejectedNow.has(target.key)) {
        slots[target.key] = { state: 'rejected', fileName: x.file.name, reason }; rejectedNow.add(target.key);
      } else ignored.push({ file: x.file.name, reason });
    }
    return { slots, accepted, ignored, used: ok.length, picked: typed.length };
  }

  /** Count accepted slots. @param {object} s @returns {number} */
  const acceptedCount = s => Object.values(s.slots).filter(x => x.state === 'accepted').length;

  /**
   * Render the welcome and wire its behaviour.
   * @param {HTMLElement} root element that receives the welcome screen
   * @param {object} cfg §3.7.2 welcome configuration
   * @param {object} h handlers:
   *   inspect(file) → Promise<{ok, dashboardTitle, projectTitle, reason}> reads the Code sheet only;
   *   load(filesByKey, report) → Promise<opener|void>; report(i) marks phase i running; throw {phase, message} to fail.
   *     Return a function that reveals the dashboard; the module calls it after the success hold (§3.7.7 rev 1.110).
   *     A load that returns nothing opens the dashboard itself and gets no hold (1.0.x behaviour).
   *   onHelp(); onStatus(level, message) for §11 messaging.
   * @returns {{ destroy():void, state():object, accept(files:File[]):Promise<void> }}
   */
  function render(root, cfg, h = {}) {
    const problems = validateConfig(cfg);
    const status = (lvl, msg) => { try { h.onStatus?.(lvl, 'CommonWelcome: ' + msg); } catch { /* never block */ } };
    if (problems.length) { status('error', 'invalid config — ' + problems.join('; ')); throw new Error('CommonWelcome config: ' + problems.join('; ')); }
    const L = { ...DEFAULT_LABELS, ...(cfg.labels || {}) };
    const N = cfg.files.length, multi = N > 1;
    const phases = cfg.phases?.length ? cfg.phases : ['Reading the workbook', 'Checking the data', 'Building the dashboard'];
    const hold = cfg.successHoldMs ?? HOLD_DEFAULT;
    const dwell = cfg.doneDwellMs ?? DWELL_DEFAULT;
    const cols = N >= 4 ? ' is-cols' : '';
    const files = {};
    let s = { slots: Object.fromEntries(cfg.files.map(f => [f.key, { state: 'needed' }])), alert: '', ignored: [], picked: 0, used: 0, view: 'slots', phase: -1, failed: null, retry: false };
    let opener = null, holdTimer = null, dwellTimer = null, tick = null, popOpen = false;
    const set = a => { s = reduce(s, a); paint(); };
    const doc = root.ownerDocument;
    const year = new Date().getFullYear();

    const many = (one, more) => multi ? more : one;
    const themePickerHtml = cfg.themePicker ? `<div class="cw-theme"><button type="button" class="cw-theme-btn" aria-haspopup="true" aria-expanded="false"><span class="cw-theme-dot" aria-hidden="true"></span><span class="cw-theme-label">${esc(L.theme)}</span></button><div class="cw-theme-menu" role="menu" hidden></div></div>` : '';
    root.innerHTML = `<div class="cw-screen" role="main">
      <div class="cw-center"><section class="cw-card ${multi ? 'is-confirm' : 'is-auto'}" aria-labelledby="cw-title">
        <header class="cw-topbar">
          <div class="cw-brand">${cfg.logo?.src ? `<img class="cw-logo" src="${esc(cfg.logo.src)}" alt="${esc(cfg.logo.alt || '')}">` : ''}
            ${cfg.brand?.name ? `<span class="cw-brand-t"><b>${esc(cfg.brand.name)}</b>${cfg.brand.tagline ? `<small>${esc(cfg.brand.tagline)}</small>` : ''}</span>` : ''}</div>
          <div class="cw-topbar-actions">${themePickerHtml}<button type="button" class="cw-help"><span class="cw-help-ic" aria-hidden="true">?</span>${esc(cfg.help)}</button></div>
        </header>
        <div class="cw-cols">
          <aside class="cw-left">
            <h1 class="cw-title" id="cw-title">${esc(cfg.title)}</h1>
            ${cfg.description ? `<p class="cw-desc">${esc(cfg.description)}</p>` : ''}
            <ol class="cw-steps" aria-label="Progress"></ol>
            ${cfg.checks?.length ? `<div class="cw-checks"><h2 class="cw-checks-h">${esc(L.checksHead)}</h2><ul>${cfg.checks.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          </aside>
          <div class="cw-right">
            <div class="cw-intro"><h2 class="cw-h">${esc(many(L.heading, L.headingMany))}</h2><p class="cw-instr">${esc(cfg.instruction)}</p></div>
            <div class="cw-body"></div>
            <div class="cw-lh"><span class="cw-lh-t">${esc(L.filesHead)}<span class="cw-sum-host"></span></span><span class="cw-lh-n"></span></div>
            <ul class="cw-slots${cols}" aria-live="polite"></ul>
            <div class="cw-pop-host"></div>
            <div class="cw-actions"><span class="cw-act"></span><p class="cw-act-t"></p></div>
            <footer class="cw-foot"><span>${esc(cfg.footer?.privacy || '')}</span><span>${esc(cfg.footer?.version || '')}${cfg.footer?.version ? ' · ' : ''}© ${year} ${esc(cfg.footer?.owner || '')}</span></footer>
          </div>
        </div>
      </section></div>
      <input type="file" class="cw-input" accept=".xlsx,.xlsm" ${multi ? 'multiple' : ''} hidden>
    </div>
    <div class="cw-overlay" aria-hidden="true"><div class="cw-overlay-box">${esc(multi ? L.overlayMany : L.overlayOne)}<small>${esc(L.overlaySub)}</small></div></div>`;
    const $ = sel => root.querySelector(sel);
    const input = $('.cw-input');

    /** Repaint steps, drop box, file list, summary and actions from state. */
    function paint() {
      const n = acceptedCount(s), busy = s.view === 'loading', after = s.view === 'ready' || s.view === 'done';
      // left panel: three steps, the same in every mode (§3.7.6 rev 1.111)
      const checking = Object.values(s.slots).some(x => x.state === 'checking');
      const step = after || busy ? 3 : multi ? (n === N ? 3 : (n > 0 || checking ? 2 : 1)) : (checking || n > 0 ? 2 : 1);
      const steps = [[many(L.stepA, fill(L.stepAMany, { n: N })), many(L.stepAText, fill(L.stepATextMany, { n: N }))],
        [L.stepB, L.stepBText], [L.stepC, many(L.stepCText, L.stepCTextMany)]];
      $('.cw-steps').innerHTML = steps.map(([t, d], i) => {
        const k = i + 1, c = (k < step || (k === 3 && s.view === 'done')) ? 'is-done' : k === step ? 'is-now' : '';
        return `<li class="cw-step ${c}"${c === 'is-now' ? ' aria-current="step"' : ''}><span class="cw-step-n" aria-hidden="true">${c === 'is-done' ? '✓' : k}</span><span><b>${esc(t)}</b><span class="cw-step-d">${esc(d)}</span></span></li>`;
      }).join('');
      // drop box or load stage — one fixed-height box (§3.7.1 rev 1.111)
      if (busy || after) {
        const at = after ? phases.length : s.phase;
        $('.cw-body').innerHTML = `<div class="cw-box cw-stage${after ? ' is-ready' : ''}">
          <ol class="cw-phases" aria-live="polite"${busy ? ' aria-busy="true"' : ''}>${phases.map((p, i) => {
            const c = i < at ? 'is-done' : i === at ? 'is-running' : '';
            return `<li class="cw-phase ${c}"><span class="cw-phase-d" aria-hidden="true">${c === 'is-done' ? '✓' : ''}</span>${esc(p)}${c === 'is-running' ? '…' : ''}</li>`;
          }).join('')}</ol>
          ${after ? `<div class="cw-ready" role="status"><span class="cw-ready-ic" aria-hidden="true">✓</span><div><b>${esc(L.ready)}</b><div class="cw-ready-s">${s.view === 'done' ? esc(L.doneNote) : esc(fill(L.openingIn, { s: (hold / 1000).toFixed(1) }))}</div></div>
            <button type="button" class="btn cw-open"${s.view === 'done' ? ' disabled' : ''}>${esc(L.openNow)}</button></div>` : ''}
          <div class="cw-bar"><i style="width:${after ? 100 : Math.round(Math.max(0, at) / phases.length * 100)}%"></i></div></div>`;
      } else {
        const err = !!s.alert;
        $('.cw-body').innerHTML = `<div class="cw-box cw-drop" role="group" aria-label="${esc(multi ? L.dropName : L.dropNameOne)}">
          <span class="cw-count">${esc(fill(many(L.countChip, L.countChipMany), { n, N }))}</span>
          <div class="cw-top${err ? ' is-err' : ''}">
            <span class="cw-drop-ic" aria-hidden="true">${err ? '!' : '⇪'}</span>
            <div class="cw-alert" role="alert">${esc(s.alert)}</div>
            <div class="cw-drop-t">${esc(multi ? L.dropTitleMany : L.dropTitleOne)}</div>
            <div class="cw-or">${esc(L.or)}</div>
            <button type="button" class="btn cw-choose${n < N ? ' btn-primary' : ''}">${esc(multi ? L.chooseMany : L.chooseOne)}</button>
            <div class="cw-prog" aria-hidden="true"><i style="width:${Math.round(n / N * 100)}%"></i></div>
            <div class="cw-types">${esc(L.fileTypes)}</div>
          </div></div>`;
      }
      // file list below the box: states only, rows never added or removed (§3.7.4 rev 1.111)
      $('.cw-slots').innerHTML = cfg.files.map((f, i) => slotHtml(f, i)).join('');
      $('.cw-lh-n').textContent = fill(L.readyCount, { n, N });
      const k = s.ignored.length;
      $('.cw-sum-host').innerHTML = k ? `<span class="cw-sum" role="status" data-ignored="${k}">${esc(fill(L.ignored, { used: s.used, total: s.picked, count: k }))}
          <button type="button" class="cw-sum-d" aria-expanded="${popOpen}" aria-controls="cw-pop">${esc(L.details)}</button></span>` : '';
      $('.cw-pop-host').innerHTML = k ? `<div class="cw-pop" id="cw-pop" role="region" aria-label="${esc(L.ignoredHead)}"${popOpen ? '' : ' hidden'}><b>${esc(L.ignoredHead)}</b>
          <ul>${s.ignored.map(x => `<li><b>${esc(x.file)}</b> — ${esc(x.reason)}</li>`).join('')}</ul></div>` : '';
      // action row: Open dashboard (confirm mode) becomes primary only when every file is ready (§3.7.6 rev 1.111)
      const canOpen = n === N && !(s.alert && !s.retry) && !busy && !after;
      $('.cw-act').innerHTML = multi
        ? `<button type="button" class="btn cw-load${canOpen ? ' btn-primary' : ''}" ${canOpen ? '' : 'disabled'}>${esc(busy ? L.loading : after ? L.opening : s.retry ? L.loadAgain : n < N ? `${L.load} (${n} of ${N})` : L.load)} <span aria-hidden="true">→</span></button>`
        : '';
      $('.cw-act-t').textContent = busy || after ? L.actBusy : n === N ? L.actReady : many(L.actAuto, fill(L.actMany, { N }));
      if (busy) root.querySelectorAll('button').forEach(b => { if (!b.classList.contains('cw-help')) b.disabled = true; });
    }

    /** Render the theme menu options and keep the button's dot/label in sync with cfg.themePicker.current. */
    function paintTheme() {
      const tp = cfg.themePicker; if (!tp) return;
      const cur = tp.themes.find(x => x.key === tp.current) || tp.themes[0];
      $('.cw-theme-dot').style.background = cur.dot;
      $('.cw-theme-label').textContent = cur.label;
      $('.cw-theme-menu').innerHTML = tp.themes.map(x => `<button type="button" role="menuitem" class="${x.key === cur.key ? 'cw-is-active' : ''}" data-theme-key="${esc(x.key)}">
        <span class="cw-theme-dot" aria-hidden="true" style="background:${esc(x.dot)}"></span>${esc(x.label)}</button>`).join('');
    }

    /** One slot. One line for 1–3 files; compact (icon status) for 4–6. @param {object} f @param {number} i @returns {string} */
    function slotHtml(f, i) {
      const x = s.slots[f.key], st = x.state;
      const mark = st === 'accepted' ? '✓' : st === 'rejected' ? '!' : i + 1;
      const full = st === 'accepted' ? `${x.fileName} · ${x.dashboardTitle}` : st === 'rejected' ? x.reason : st === 'checking' ? L.checking : L.still;
      const icon = { accepted: '✓', rejected: '✗', checking: '⟳', needed: '○' }[st];
      const text = cols ? icon : `${st === 'checking' ? '' : icon + ' '}${full}`;
      const rm = st === 'accepted' || st === 'rejected';
      return `<li class="cw-slot is-${st}" data-key="${esc(f.key)}" title="${esc(f.name + ' — ' + full)}"><span class="cw-slot-n" aria-hidden="true">${mark}</span>
        <span class="cw-slot-name"><b>${esc(f.name)}</b></span><span class="cw-slot-st"${cols ? ' aria-hidden="true"' : ''}>${esc(text)}</span>
        ${rm ? `<button type="button" class="cw-remove" data-remove="${esc(f.key)}" aria-label="${esc(L.remove + ' ' + f.name)}">✕</button>` : '<span></span>'}${cols ? `<span class="cw-sr">${esc(full)}</span>` : ''}</li>`;
    }

    /**
     * Check the picked files, then commit them (§3.7.5 rev 1.110). File errors go to the slot of their
     * own type; unrequired or untyped files go to the ignored summary; set errors go to the alert.
     * @param {File[]} picked
     */
    async function accept(picked) {
      if (!picked.length || s.view !== 'slots') return;
      let extra = [];
      if (!multi && picked.length > 1) { extra = picked.slice(1).map(f => ({ file: f.name, reason: L.onlyOne })); picked = picked.slice(0, 1); }
      const beforeSlots = { ...s.slots }, beforeFiles = { ...files };
      if (!multi) set({ type: 'checking', keys: [cfg.files[0].key] });
      const results = [];
      for (const file of picked) {
        let r;
        try { r = await h.inspect(file); } catch (e) { r = { ok: false, reason: L.unreadable + (e?.message ? ' ' + e.message : '') }; }
        results.push({ file, r: r || { ok: false, reason: L.unreadable } });
      }
      const p = plan(cfg, results, beforeSlots, L);
      popOpen = false;
      if (p.setError) { set({ type: 'restore', slots: beforeSlots, alert: p.setError }); status('warning', 'set error: ' + p.setError); return; }
      for (const k of Object.keys(files)) delete files[k];
      Object.assign(files, beforeFiles, p.accepted);
      for (const k of Object.keys(p.slots)) if (p.slots[k].state !== 'accepted') delete files[k];
      const ignored = [...p.ignored, ...extra];
      set({ type: 'restore', slots: p.slots, alert: '', ignored, picked: p.picked + extra.length, used: p.used });
      ignored.forEach(x => status('warning', `ignored: ${x.file} — ${x.reason}`));
      if (!multi && p.slots[cfg.files[0].key].state === 'accepted') {
        await new Promise(r => (typeof requestAnimationFrame === 'function'
          ? requestAnimationFrame(() => requestAnimationFrame(r))
          : setTimeout(r, 0)));
        await load();
      }
    }

    /** Run the load phases, then the success hold (§3.7.7 rev 1.110). */
    async function load() {
      popOpen = false;
      set({ type: 'phase', index: 0 });
      let out;
      try {
        out = await h.load({ ...files }, i => set({ type: 'phase', index: i }));
      } catch (e) {
        const i = Number.isInteger(e?.phase) ? e.phase : Math.max(0, s.phase);
        set({ type: 'fail', index: i, reason: e?.message || String(e) });
        status('error', 'load failed at phase ' + i + ': ' + (e?.message || e));
        return;
      }
      opener = typeof out === 'function' ? out : null;
      if (!opener || hold <= 0) { finish(); return; }
      const end = Date.now() + hold;
      set({ type: 'ready', phases: phases.length });
      const bar = $('.cw-stage .cw-bar > i');
      if (bar) {
        bar.style.transitionDuration = '0ms'; bar.style.width = '100%';
        const go = () => { bar.style.transitionDuration = hold + 'ms'; bar.style.width = '0%'; };
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => requestAnimationFrame(go)); else go();
      }
      $('.cw-open')?.focus();
      tick = setInterval(() => { const el = $('.cw-ready-s'); if (el) el.textContent = fill(L.openingIn, { s: (Math.max(0, end - Date.now()) / 1000).toFixed(1) }); }, 100);
      holdTimer = setTimeout(finish, hold);
      status('info', `load complete; success hold ${hold} ms`);
    }

    /** End the hold and reveal the dashboard. Safe to call twice. */
    function finish() {
      clearTimeout(holdTimer); clearTimeout(dwellTimer); clearInterval(tick); holdTimer = dwellTimer = tick = null;
      if (s.view === 'done') return;
      set({ type: 'done' });
      const o = opener; opener = null;
      const reveal = () => {
        try { o?.(); } catch (e) { status('error', 'open failed: ' + (e?.message || e)); }
        status('info', 'opened');
      };
      if (dwell > 0) { dwellTimer = setTimeout(reveal, dwell); status('info', `done-step dwell ${dwell} ms`); }
      else if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => requestAnimationFrame(reveal));
      else setTimeout(reveal, 0);
    }

    // ----- events -----
    const onClick = ev => {
      const t = ev.target;
      if (t.closest('.cw-remove')) { const k = t.closest('.cw-remove').dataset.remove; delete files[k]; set({ type: 'remove', key: k }); return; }
      if (t.closest('.cw-help')) { h.onHelp?.(); return; }
      if (t.closest('.cw-theme-btn')) {
        const open = $('.cw-theme-menu').hidden; $('.cw-theme-menu').hidden = !open;
        $('.cw-theme-btn').setAttribute('aria-expanded', String(open)); return;
      }
      if (t.closest('[data-theme-key]')) {
        const key = t.closest('[data-theme-key]').dataset.themeKey;
        cfg.themePicker.current = key; paintTheme(); $('.cw-theme-menu').hidden = true;

// xlsx-reader.mjs — zero-dependency .xlsx reader (ZIP + XML).
// Runs in Node (v18+) and modern browsers (DecompressionStream + Response are global).
// Reads: sharedStrings, workbook sheet map, and any worksheet as { rows:[ {A:val,...} ] , maxRow }.
// Dates are returned as Excel serial numbers; the pipeline converts them using the Code column-map "Date" type.

const EOCD = 0x06054b50;
const CDH  = 0x02014b50;
const LFH  = 0x04034b50;

function colToNum(letters){ let n=0; for(const ch of letters.toUpperCase()) n=n*26+(ch.charCodeAt(0)-64); return n; }
function numToCol(n){ let s=''; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }

async function inflateRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(buf);
}

async function unzip(buf){
  const bytes = new Uint8Array(buf);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  // locate End Of Central Directory — scan BACKWARD from the tail so the LAST
  // occurrence is found, as required by the ZIP spec (a comment or data earlier
  // in the file can contain the magic bytes; only the last match is the real EOCD).
  let eocd = -1;
  const min = Math.max(0, bytes.length - 65557);
  for(let i=bytes.length-22; i>=min; i--){
    if(dv.getUint32(i, true) === EOCD){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Not a valid ZIP/XLSX (EOCD not found)');
  const cdOffset = dv.getUint32(eocd+16, true);
  const total = dv.getUint16(eocd+10, true);
  const files = {};
  let p = cdOffset;
  for(let i=0; i<total; i++){
    if(dv.getUint32(p, true) !== CDH) break;
    const method = dv.getUint16(p+10, true);
    const compSize = dv.getUint32(p+20, true);
    const nameLen = dv.getUint16(p+28, true);
    const extraLen = dv.getUint16(p+30, true);
    const commentLen = dv.getUint16(p+32, true);
    const lho = dv.getUint32(p+42, true);
    const next = p + 46 + nameLen + extraLen + commentLen;
    // The local file header must carry the LFH signature. If it doesn't, the
    // offset recorded in the central directory is bogus, and reading
    // nameLen/extraLen from it would silently slice the wrong bytes — skip
    // this entry rather than trusting it (and keep walking the directory).
    if(lho + 30 > bytes.length || dv.getUint32(lho, true) !== LFH){ p = next; continue; }
    const nameBytes = bytes.subarray(p+46, p+46+nameLen);
    const name = new TextDecoder().decode(nameBytes);
    // local header: nameLen/extraLen at +26/+28
    const lNameLen = dv.getUint16(lho+26, true);
    const lExtraLen = dv.getUint16(lho+28, true);
    const dataStart = lho + 30 + lNameLen + lExtraLen;
    let data = bytes.subarray(dataStart, dataStart + compSize);
    if(method === 8) data = await inflateRaw(data);
    files[name] = data;
    p = next;
  }
  return files;
}

function decodeUtf8(bytes){ return new TextDecoder().decode(bytes); }

// minimal attribute extractor for a single tag's attribute string
function attrs(str){
  const out = {};
  const re = /([\w:]+)\s*=\s*"([^"]*)"/g; let m;
  while((m = re.exec(str))) out[m[1]] = m[2];

}

function unescXml(s){
  // XML entity decode — must run on every string extracted from raw XML text.
  // Without this, any cell value containing & < > ' " arrives as &amp; &lt; etc.
  return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");

function parseSharedStrings(xmlBytes){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const list = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g; let m;
  while((m = siRe.exec(xml))){

    let text = '', t;
    const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
    while((t = tRe.exec(inner))) text += unescXml(t[1]);
    list.push(text);
  }

}

function parseWorkbook(xmlBytes){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const sheets = {}; // name -> rId
  const sRe = /<sheet\b([^>]*)>/g; let m;
  while((m = sRe.exec(xml))){
    const a = attrs(m[1]);
    if(a.name && a['r:id']) sheets[a.name] = a['r:id'];

  return sheets;
}

function parseRels(xmlBytes){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const map = {}; // Id -> Target
  const rRe = /<Relationship\b([^>]*)>/g; let m;
  while((m = rRe.exec(xml))){
    const a = attrs(m[1]);
    if(a.Id && a.Target) map[a.Id] = a.Target;
  }
  return map;
}

function cellValue(tagInner, shared){
  // tagInner is the text of a <c ...>...</c> block
  const a = attrs(tagInner);
  const t = a.t || '';
  const isMatch = /<is>([\s\S]*?)<\/is>/.exec(tagInner);
  let vText = '';
  if(isMatch){
    const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g; let tm;
    while((tm = tRe.exec(isMatch[1]))) vText += unescXml(tm[1]);
  } else {
    const vMatch = /<v>([\s\S]*?)<\/v>/.exec(tagInner);
    if(vMatch) vText = vMatch[1];
  }
  const v = vText.trim();
  if(v === '') return undefined;
  if(t === 's') return shared[parseInt(v,10)] ?? v;
  if(t === 'inlineStr' || t === 'str') return v;
  if(t === 'b') return v === '1' || v === 'true';
  // default: number (also covers date serials — pipeline converts by column type)
  if(/^-?\d+(\.\d+)?$/.test(v)) return parseFloat(v);
  return v;

function parseSheet(xmlBytes, shared){
  const xml = decodeUtf8(xmlBytes || new Uint8Array());
  const rows = []; // 1-based; rows[0] unused
  // find each <c ...>...</c> OR self-closing (Excel never self-closes <c> with content, but be safe)
  const cRe = /<c\b([\s\S]*?)<\/c>/g; let m;
  while((m = cRe.exec(xml))){
    const block = m[1] + '</c>'; // ensure we have closing for attrs+inner
    const open = /<c\b([^>]*)>/.exec(m[1].split('>')[0] + '>');
    const a = attrs(open ? open[1] : m[1]);
    const ref = a.r; if(!ref) continue;
    const col = ref.replace(/\d+$/, '');
    const rowNum = parseInt(ref.match(/\d+$/)[0], 10);
    const val = cellValue(block, shared);
    if(val === undefined) continue;
    if(!rows[rowNum]) rows[rowNum] = {};
    rows[rowNum][col] = val;
  }
  let maxRow = 0;
  for(let i=1;i<rows.length;i++) if(rows[i]) maxRow = i;
  return { rows, maxRow };
}

async function readXlsx(buffer){
  const files = await unzip(buffer);
  const shared = parseSharedStrings(files['xl/sharedStrings.xml']);
  const sheetRid = parseWorkbook(files['xl/workbook.xml']);
  const rels = parseRels(files['xl/_rels/workbook.xml.rels']);
  const sheets = {};
  for(const name of Object.keys(sheetRid)){
    const rid = sheetRid[name];
    let target = rels[rid] || '';
    target = target.replace(/^\//, '');
    const key = (target.startsWith('xl/') ? target : 'xl/' + target);
    const data = files[key];
    sheets[name] = data ? parseSheet(data, shared) : { rows: [], maxRow: 0 };

// Pure logic (no DOM). Consumed by render (browser) and test_pipeline (Node).

const EXCLUDE_STAGES = ['Deleted', 'Void', 'Superseded'];

// ---- Excel serial date helpers ----
function excelSerialToISO(serial){

// treated as an Excel serial; otherwise Date() would read it as year 46096.
function parseProjectStart(cell){

// Spreadsheet formula-error tokens. A cell whose cached value equals one of these is not a valid

// fatal W-FORMULA warning can be raised per affected column.

// A formula-error cell counts as PRESENT for the gate (a corrupt date must not be silently

// truth for the approval KPIs (I-78), the Panel 3 matrix (I-79), the Panel 4 chart (I-80) and
// the Panel 8 table pills. Record Error stays a single umbrella (approval without submission,

  projectCode:   ['WBS Contract Code'],
  prefix:        ['PROJECT PREFIX'],
  docType:       ['Doc Code'],

// Scan the WHOLE Code sheet (label in A, value in B, type in C). Returns
// keyed-by-label metadata; positions are never assumed.
function parseCodeSheet(codeSheet){

// Field label -> column index, resolved from the Code column map.

// Field -> DataType map (from the Code!C column).
function parseFieldTypes(codeSheet){

    const key = row.A, t = row.C;

// Locate each lookup block by its ROW-1 HEADER text. Exact match wins, then
// case-insensitive prefix. Returns { idx, src } keyed by LOOKUP_HEADERS keys.
function findLookupColumns(codeSheet){

  for(const [k, v] of Object.entries(codeMeta)){
    if(/first client review/i.test(k)) reviewRules.firstClientReview = parseInt(v, 10) || reviewRules.firstClientReview;
    else if(/resubmission/i.test(k)) reviewRules.resubmissionDuration = parseInt(v, 10) || reviewRules.resubmissionDuration;
  }

  // --- lookup blocks: discover each by its row-1 header (no fixed column letters) ---
  const lk = findLookupColumns(codeSheet);
  for(const [k, hdr] of Object.entries(LOOKUP_HEADERS)){
    if(lk.idx[k] == null) warnings.push({ level:'warn', code:'V-18', tab:'Code', message:`Lookup block not found in row 1: "${hdr[0]}".` });
  }
  const lookupBlock = (codeKey) => {
    const codeIdx = lk.idx[codeKey];
    if(codeIdx == null) return { items: [], codes: new Set() };
    const map = readLookupMap(codeSheet, codeIdx, codeIdx + 1, 2);
    const items = Object.entries(map).map(([code, label]) => ({ code, label }));
    const codes = new Set(Object.keys(map));
    return { items, codes };
  };
  const lookups = {
    stage: lookupBlock('stage'),
    uesh: lookupBlock('uesh'),
    projectCode: lookupBlock('projectCode'),
    prefix: lookupBlock('prefix'),
    docType: lookupBlock('docType'),
    disciplineCode: lookupBlock('disciplineCode'),
    authority: lookupBlock('authority'),
    submissionStatus: lookupBlock('submissionStatus'),
    approval: lookupBlock('approval'),
    // I-114 — workbook source of truth for the Overdue Type labels (Code!AN:AO).
    overdueType: lookupBlock('overdueType'),
  };
  // --- Error block: code -> {group, rule, severity} via discovered columns ---
  const eCode = lk.idx['errorCode'];
  const errorBlock = { map: {}, order: [] };
  if(eCode != null){
    const eRule = readLookupMap(codeSheet, eCode, lk.idx['errorRule'], 2);
    const eSev  = readLookupMap(codeSheet, eCode, lk.idx['errorSeverity'], 2);
    const eGrp  = readLookupMap(codeSheet, eCode, lk.idx['errorGroup'], 2);
    for(const c of Object.keys(eRule)){
      errorBlock.map[c] = { group: eGrp[c] || '', rule: eRule[c] || '', severity: eSev[c] || 'Warning' };
      errorBlock.order.push(c);
    }
  }

  // --- BQ reference set ---
  const bqSheet = workbook.sheets['BQ'];
  const bqSet = new Set();
  if(bqSheet){ for(let r = 2; r <= bqSheet.maxRow; r++){ const v = bqSheet.rows[r] && bqSheet.rows[r].A; if(v != null && v !== '') bqSet.add(String(v)); } }

  // --- discipline tab discovery ---
  const ueshNames = [...lookups.uesh.codes];
  const available = [], noListYet = [], excluded = ['BQ', 'Notes', 'Dashboard', 'Code'];
  Object.keys(workbook.sheets).forEach(name => {
    if(excluded.includes(name)) return;
    if(ueshNames.includes(name)) available.push(name);
    else noListYet.push(name); // a non-document-list tab that is not a known discipline
  });
  const noListYetDisciplines = ueshNames.filter(n => !available.includes(n));

  // --- consolidate ---
  const records = [];
  const errorCounts = {};   // I-74: per-field count of spreadsheet formula-error cells
  const blankDocIssues = [];
  for(const tab of available){
    const sheet = workbook.sheets[tab]; if(!sheet) continue;
    let tabMaxDataRow = 1;
    for(let r = 2; r <= sheet.maxRow; r++){
      const row = sheet.rows[r]; if(!row) continue;
      const hasContent = Object.values(row).some(v => v !== '' && v != null);
      if(hasContent && r > tabMaxDataRow) tabMaxDataRow = r;
      const fields = {};
      const fieldErrors = new Set();   // I-77: per-record set of fields whose raw cell was a formula-error token
      fieldOrder.forEach(f => {
        let v = row[letterOf(f)];
        if(v == null || v === '') return;                       // blank -> absent (undefined)
        if(typeof v === 'string' && isExcelError(v)){           // formula error -> absent + counted
          errorCounts[f] = (errorCounts[f] || 0) + 1;
          fieldErrors.add(f);
          return;
        }
        if(typeOf(f) === 'Date' && typeof v === 'number'){ const iso = excelSerialToISO(v); if(iso) v = iso; }
        else if(typeOf(f) === 'Boolean'){ v = normalizeBool(v); }
        else v = (typeof v === 'string') ? v : String(v);
        fields[f] = v;
      });
      const docNo = fields['Document No.'];
      if(docNo == null || docNo === ''){
        // V-01: populated row with blank Document No. (still surfaced, not added)
        const otherwise = Object.keys(fields).some(k => k !== 'Document No.' && fields[k] !== '' && fields[k] != null);
        if(otherwise) blankDocIssues.push({ code: 'V-01', sourceTab: tab, rownum: r });
        continue;
      }
      const stage = fields['Stage'] || '';
      const isActive = !EXCLUDE_STAGES.includes(stage);
      records.push({ sourceTab: tab, rownum: r, fields, fieldErrors, discipline: fields['UESH Discipline'] || '', stage, isActive, docNo });
    }
    if(tabMaxDataRow > listEndRow){
      warnings.push({ level:'warn', code:'W-ENDROW', tab, actual: tabMaxDataRow, limit: listEndRow,
        message: `List End Row (Code!B8 = ${listEndRow}) exceeded on tab "${tab}": ${tabMaxDataRow} data rows found. All rows are included (none dropped); raise Code!B8 if this is expected.` });
    }
  }

  // --- I-74/I-75: aggregate formula-error cells into ONE fatal warning per affected column ---
  // (deliberately NOT pushed to model.issues — those are row-keyed and filtered by activeSet, so a
  // column summary would never surface in Panel 12). They route to the top errBanner as fatal.
  for(const f of fieldOrder){
    const n = errorCounts[f];
    if(!n) continue;
    warnings.push({
      level: 'fatal', code: 'W-FORMULA', tab: f,
      message: `${f} (column ${letterOf(f)}) contains ${n} spreadsheet formula-error cell${n === 1 ? '' : 's'} (e.g. #VALUE!). These are not valid values and silently corrupt counts, so the affected KPIs / metrics are untrustworthy. In Excel, fix the formula errors (e.g. a referenced sheet such as SubmittalLog may be missing or broken), then force a full recalculation (Ctrl+Alt+F9) and save the file so values are stored; re-open here.`
    });
  }

  // --- I-82: Record Error consistency notice (distinct from W-FORMULA, condition summary) ---
  // Fires where Latest Approval Status is present (any value, incl. unrecognized) but Actual 1st
  // Issue Date is absent — the record must be corrected before approval KPIs are trustworthy.
  // A date formula-error counts as present, and an invalid status code WITH a submission date is a
  // separate Record Error handled by the KPI/chart, not this notice.
  const recErrDocs = records.filter(r => {
    const a = r.fields['Latest Approval Status'];
    const aPresent = a !== undefined && a !== null && String(a).trim() !== '' && !(r.fieldErrors && r.fieldErrors.has('Latest Approval Status'));
    const uAbsent = (r.fields['Actual 1st Issue Date'] || '') === '' && !(r.fieldErrors && r.fieldErrors.has('Actual 1st Issue Date'));
    return aPresent && uAbsent;
  });
  if(recErrDocs.length){
    warnings.push({
      level: 'warn', code: 'W-RECERR', tab: 'Process',
      message: `${recErrDocs.length} document(s) have an approval status but no Actual 1st Issue Date (Record Error). Correct the record(s) — add the submission date or remove the stray status — before relying on the approval KPIs.`
    });
  }

  // --- validation ---
  const issues = [];
  const severityOf = code => (errorBlock.map[code] && errorBlock.map[code].severity) || 'Warning';
  const messageOf = code => (errorBlock.map[code] && errorBlock.map[code].rule) || (`Rule ${code} (generic message)`);
  // `field` = the source column the business rule checks; `value` = the offending cell value
  // the pipeline found (the validation result). Both surface in the Validation panel (spec §4.5).
  const mkIssue = (code, rec, field, value) => ({
    code, severity: severityOf(code), message: messageOf(code),
    sourceTab: rec ? rec.sourceTab : null, rownum: rec ? rec.rownum : null,
    docNo: rec ? rec.docNo : null, discipline: rec ? rec.discipline : null,
    field: field || null, value: (value === undefined ? null : value)
  });
  const inSet = (set, v) => v != null && v !== '' && set.has(String(v));

  // V-13 (contract): lookup block with label but empty code
  Object.entries(lookups).forEach(([key, blk]) => {
    blk.items.forEach(it => { if(it.label && !it.code) issues.push({ code: 'V-13', severity: severityOf('V-13'), message: messageOf('V-13') + ` (block ${key})`, sourceTab: 'Code', rownum: null, docNo: null, discipline: null, field: 'lookup block (' + key + ')', value: it.label }); });
  });
  blankDocIssues.forEach(b => issues.push(mkIssue('V-01', b, 'Document No.', '(blank)')));

  // duplicate Document No. (V-26)
  const docCount = {};
  records.forEach(rec => { const k = rec.docNo; docCount[k] = (docCount[k] || 0) + 1; });

  for(const rec of records){
    const f = rec.fields;
    const M = f['Document No.'];
    const B = f['Stage'] || '';
    const C = f['UESH Discipline'] || '';
    const J = f['Discipline'] || '';
    const I = f['Doc Type'] || '';
    const Q = f['Authority'] || '';
    const W = f['Submission Status'] || '';
    const G = f['Project Code'] || '';
    const H = f['Project Prefix'] || '';
    const K = f['Number'] || '';
    const Y = f['Latest Approval Status'] || '';
    const E = f['BQ Number'] || '';
    const P = f['As-Built'] || '';
    const R = f['Vendor Data'] || '';
    const S = f['Planned 1st Issue Date'] || '';
    const T = f['Forecast 1st Issue Date'] || '';
    const U = f['Actual 1st Issue Date'] || '';
    const V = f['Prolog Number'] || '';
    const X = f['Latest Approval Date'] || '';
    const N = f['Document Title'] || '';

    if(!inSet(lookups.stage.codes, B)) issues.push(mkIssue('V-02', rec, 'Stage', B));
    if(!inSet(lookups.uesh.codes, C)) issues.push(mkIssue('V-03', rec, 'UESH Discipline', C));
    if(J !== '' && !inSet(lookups.disciplineCode.codes, J)) issues.push(mkIssue('V-04', rec, 'Discipline Code', J));
    if(I !== '' && !inSet(lookups.docType.codes, I)) issues.push(mkIssue('V-05', rec, 'Doc Type', I));
    if(Q !== '' && !inSet(lookups.authority.codes, Q)) issues.push(mkIssue('V-06', rec, 'Authority', Q));
    if(W !== '' && !inSet(lookups.submissionStatus.codes, W)) issues.push(mkIssue('V-07', rec, 'Submission Status', W));
    if(Y !== '' && !inSet(lookups.approval.codes, Y)) issues.push(mkIssue('V-08', rec, 'Latest Approval Status', Y));
    if(P === 'YES' && U === '') issues.push(mkIssue('V-10', rec, 'Actual 1st Issue Date', U));
    if(EXCLUDE_STAGES.includes(B)) issues.push(mkIssue('V-12', rec, 'Stage', B));
    if(G !== '' && !inSet(lookups.projectCode.codes, G)) issues.push(mkIssue('V-14', rec, 'Project Code', G));
    if(/xxxx/i.test(M)) issues.push(mkIssue('V-15', rec, 'Document No.', M));
    // V-17 composition G-H-I-J-K (J = client Discipline Code)
    if(G && H && I && J && K){ const expected = [G, H, I, J, K].join('-'); if(M !== expected) issues.push(mkIssue('V-17', rec, 'Document No.', M)); }
    // V-19 — Submission Status (W) is a calculated column. "NFS" means SubmittalLog has no row
    // for this document, so an empty Prolog Number (V) is correct. Only a real disagreement
    // between the two sources is a defect.
    if(W === 'NFS' && V !== '') issues.push(mkIssue('V-19', rec, 'Prolog Number', V));
    if(W !== '' && W !== 'NFS' && V === '') issues.push(mkIssue('V-19', rec, 'Prolog Number', V));
    if(U !== '' && (V === '' || W === '')) issues.push(mkIssue('V-18', rec, 'Actual 1st Issue Date', U));
    if(Y === 'APP' && X === '') issues.push(mkIssue('V-11', rec, 'Latest Approval Status', Y));
    if(W === 'RTR' && (Y === '' || /void/i.test(Y))) issues.push(mkIssue('V-16', rec, 'Submission Status', W));
    if(['APP', 'AWC', 'REJ', 'NAP'].includes(Y) && (U === '' || X === '')) issues.push(mkIssue('V-20', rec, 'Latest Approval Status', Y));
    if(X !== '' && (Y === '' || (U !== '' && isoToDate(X) < isoToDate(U)))) issues.push(mkIssue('V-21', rec, 'Latest Approval Date', X));
    // V-09 date order — fire ONCE per document even if multiple pairs are out of order
    if((S && T && isoToDate(T) < isoToDate(S)) ||
       (T && U && isoToDate(U) < isoToDate(T)) ||
       (S && U && isoToDate(U) < isoToDate(S))) issues.push(mkIssue('V-09', rec, 'Date Order', 'dates out of order'));
    if(U !== '' && (S === '' || T === '')) issues.push(mkIssue('V-22', rec, 'Actual 1st Issue Date', U));
    // V-23 — fire ONCE per document if Actual 1st Issue Date (U) or Latest Approval Date (X)
    // is later than today. Planned (S) and Forecast (T) are forward-looking, so the rule text
    // excludes them from this check.
    { const fut=[U,X].find(d=>d&&isoToDate(d)&&isoToDate(d)>today); if(fut) issues.push(mkIssue('V-23', rec, 'Future Date', fut)); }
    // V-28: a 1st-issue date precedes the declared project start date (Code!B6). Fires once per
    // document if any of Planned/Forecast/Actual is earlier than projectStartDate (only when B6 set).
    if(projectStartDate){ const ps = isoToDate(projectStartDate);
      const pre=[S,T,U].find(d=>d&&isoToDate(d)&&isoToDate(d)<ps);
      if(pre) issues.push(mkIssue('V-28', rec, '1st Issue Date', pre)); }
    if(E !== '' && !bqSet.has(String(E))) issues.push(mkIssue('V-24', rec, 'BQ Number', E));
    const required = [N, C, B, I, J, G, H, K];
    { const miss = required.filter(v => v === '' || v == null); if(miss.length) issues.push(mkIssue('V-25', rec, 'Required Field', miss.join(', '))); }
    if(docCount[M] > 1) issues.push(mkIssue('V-26', rec, 'Document No.', M));
    const boolVal = v => (v === 'YES' || v === 'NO' || v === '');
    if(!boolVal(P) || !boolVal(R)) issues.push(mkIssue('V-27', rec, 'Vendor Data', !boolVal(P)?P:R));
  }

  // --- Data-completeness group (S3 contract) ---
  // The set of validation codes that count toward the data-completeness %. It is a
  // validation constant (not an aggregation) and is consumed by deriveView (S4) to compute
  // the completeness %. The actual aggregation now lives solely in deriveView (spec §3.8),
  // so buildModel performs S2 (normalise) + S3 (validate) only — no KPI/chart math here.
  const completenessGroup = new Set(['V-17','V-18','V-19','V-20','V-21','V-22','V-23','V-24','V-25','V-26','V-27']);

  return {
    meta: { generatedAt: new Date().toISOString(), workbookName: options.workbookName || '', today: todayISO, projectStartDate, listEndRow, projectTitle, dashboardTitle },
    contract: { columnMap, fieldOrder, reviewRules, errorBlock, noListYetDisciplines, lookups },
    tabs: { available, noListYet, excluded },
    records, issues, warnings, completenessGroup: [...completenessGroup],
  };
}

// tokens actually designed for header surfaces, already AA-safe in every theme and never equal to

// Revision 1.1 | 2026-11-26 | CodeBuddy (AI) | I-164 W3 — replace the local welcome with CommonWelcome.render() and Code-sheet-first handlers.
// render.mjs — DOM rendering + filters + for the MDL dashboard (browser).

const COLORS = { blue:'#1E88E5', green:'#2E7D32', amber:'#F9A825', red:'#C62828', slate:'#64748B', navy:'#0F2D52', grey:'#B8C2CC', blueGrey:'#78909C', purple:'#8E24AA' };
const PALETTE = ['#1E88E5','#2E7D32','#F9A825','#C62828','#64748B','#7E57C2','#26A69A','#EC407A','#8D6E63','#42A5F5','#9CCC65','#FF7043'];
// I-166 / common C-08 (T5) — COLORS/PALETTE below are now fallback tables only. CHART() resolves the
// live theme's --chart-1..6 / semantic tokens at paint time via getComputedStyle, same pattern already
// used by curveExportMarkup() for var(--blue) resolution. Charts built while off-DOM or before first
// paint (rare) fall back to the literal tables so nothing renders unstyled.
const CHART_KEY_TO_VAR = { blue:'blue', green:'green', amber:'amber', red:'red', navy:'navy', slate:'slate',
  grey:'status-neutral-fg', blueGrey:'status-neutral2-fg', purple:'status-purple-fg' };
function CHART(key){
  try{
    const v = getComputedStyle(document.body).getPropertyValue('--'+(CHART_KEY_TO_VAR[key]||key)).trim();
    return v || COLORS[key];
  }catch(e){ return COLORS[key]; }
}
function CHART_SERIES(i){
  try{
    const v = getComputedStyle(document.body).getPropertyValue('--chart-'+(1+(i%6))).trim();
    return v || PALETTE[i%PALETTE.length];
  }catch(e){ return PALETTE[i%PALETTE.length]; }
}

const KPI_TIP_META = {

};
function kpiTipHtml(label, asof, token){
  const m = KPI_TIP_META[label] || ['KPI detail.', '—', 'No definition is recorded.'];
  const t = token || 'var(--blue)';
  return '<b><span class="kpi-tip-swatch" style="--tip-swatch:' + t + '"></span>' + esc(label) + '</b>'
    + '<div class="chart-tip-row"><span class="k">Purpose</span><span>' + esc(m[0]) + '</span></div>'
    + '<div class="chart-tip-row"><span class="k">Source</span><span>' + esc(m[1]) + '</span></div>'
    + '<div class="chart-tip-row"><span class="k">Calculation</span><span>' + esc(m[2]) + '</span></div>'
    + '<div class="chart-tip-foot"><span>Active scope</span><span>' + esc(asof || 'current selection') + '</span></div>';
}
const kpiSwatch = c => ({ok:'var(--green)',amb:'var(--amber)',warn:'var(--red)',muted:'var(--slate)',err:'var(--error-fg)'})[c] || 'var(--blue)';
const isoStrToDate = iso => { if(!iso) return null; const d = new Date(iso + 'T00:00:00Z'); return isNaN(d) ? null : d; };
function wdBetween(d1, d2){ if(!d1||!d2) return null; let s=1; if(d2<d1){[d1,d2]=[d2,d1];s=-1;} let c=0,cur=new Date(d1.getTime()); while(cur<=d2){ const day=cur.getUTCDay(); if(day!==0&&day!==6)c++; cur.setUTCDate(cur.getUTCDate()+1);} return s*c; }

const CSS = `
/* Theme tokens (bg/surface/text/chrome/nav/accent/status/chart/pchip/ds-zebra, all 6 themes) now come
 * from the inlined common/tokens/tokens.css, placed immediately before this block by build.mjs's
 * inlineCommon({modules:['tokens','welcome']}) call (common C-08 / AGENTS.md §18.4 rev 2026-11-28).
 * This :root only holds the tokens MDL does not share with other dashboards (layout metrics,
 * segmented-control sizing, crosshair accents, and two still-unused legacy tokens --warn/--bad
 * kept for compatibility). --crosshair-* and --header-crosshair-accent now reference var(--accent)/
 * var(--soft) instead of a frozen light-blue literal, so the crosshair correctly follows theme. */
:root{--slate:#64748B;--card:#FFFFFF;--accent2:#2E7D32;--warn:#F9A825;--bad:#C62828;--radius:10px;--font:'Segoe UI',system-ui,-apple-system,'Inter','Source Sans Pro',Roboto,Helvetica,Arial,sans-serif;--warn-border:#F0D38A;--warn-fg-strong:#9a6b00;--accent-soft-border:#BFD8F2;--accent-ink:#1E88E5;--grid:#EDF1F5;--sidebar-w:160px;--nav-bg-hover:rgba(255,255,255,.10);--panel-gap:14px;--btn-h:32px;--seg-h:32px;--crosshair-ring:var(--accent);--header-crosshair-accent:var(--accent);--tool-pad:12px;--tool-gap:10px;--c1-plot-table-gap:10px;--seg-pad-y:6px;--seg-pad-x:10px;--seg-fs:12px;--seg-fw:600;--seg-lh:1.2;--seg-active-bg:var(--navy);--seg-active-fg:var(--on-fill);--seg-hover-bg:var(--surface2);--seg-hover-fg:var(--blue);--seg-pressed-bg:var(--surface3);--seg-focus:var(--blue);--seg-focus-on-active:var(--on-fill);--seg-disabled-opacity:.5}
*{box-sizing:border-box}
.shell-main{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);flex:1 1 auto;min-height:0;transition:grid-template-columns .12s ease}
body.sidebar-collapsed .shell-main{grid-template-columns:minmax(0,1fr)}
body.sidebar-collapsed [data-shell="left-sidebar"]{display:none}
[data-shell="left-sidebar"]{position:relative;display:flex;flex-direction:column;background:var(--nav-bg);color:var(--nav-fg);min-height:0}
.nav-list,.nav-tools{display:flex;flex-direction:column;gap:2px;padding:10px}
.nav-tools{margin-top:auto;border-top:1px solid rgba(255,255,255,.14)}
.nav-item{min-height:36px;padding:8px 12px;border:0;border-radius:6px;background:var(--nav-bg);color:var(--nav-fg);font-size:14px;font-weight:400;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:var(--nav-bg-hover)}
.nav-item.active,.nav-item[aria-current="page"]{background:var(--nav-bg-active);font-weight:600}
