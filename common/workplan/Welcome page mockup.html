<title>Welcome page mockup (MDL / PPP / Sub)</title>
<style>
:root{--bg:#F3F5F8;--surface:#fff;--surface2:#EEF2F7;--border:#D5DCE5;--text:#1B2733;--text2:#4A5A6B;--text3:#7A8899;
--navy:#1F3A5F;--blue:#2F6FB3;--success:#1E8E5A;--success-bg:#E6F4EC;--danger:#B42318;--danger-bg:#FDECEC;--danger-bd:#F3B4B4;
--btn-h:32px;--radius:8px;--welcome-card-w:clamp(480px,45vw,640px);--welcome-card-pad:32px;--welcome-card-radius:16px;--welcome-logo-h:40px;--welcome-drop-ratio:1.618;
--font-ui:system-ui,-apple-system,'Segoe UI',sans-serif;--shadow:0 8px 28px rgba(16,32,56,.10)}
[data-theme="dark"]{--bg:#121820;--surface:#1A222D;--surface2:#232E3B;--border:#33404F;--text:#E6EBF1;--text2:#B3BFCC;--text3:#8593A3;
--blue:#5B9BE0;--success:#4CC38A;--success-bg:#173326;--danger:#F08A80;--danger-bg:#3A1D1B;--danger-bd:#6B2C27;--shadow:0 8px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:13px/1.45 var(--font-ui);background:var(--bg);color:var(--text);transition:background .25s,color .25s}
.rv{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;background:#0d1b2a;color:#fff;font-size:12px;min-height:40px}
.rv b{margin:0 4px 0 8px}.rv b:first-child{margin-left:0}.rv button{font:inherit;border:1px solid #47607c;background:#1c3149;color:#fff;border-radius:6px;padding:4px 9px;cursor:pointer}
.rv button.on{background:#2F6FB3;border-color:#2F6FB3}.rv .sp{flex:1}.rv .sep{width:1px;height:20px;background:#47607c;margin:0 4px}
.welcome-screen{position:fixed;inset:var(--rv-h,40px) 0 0 0;overflow:auto;display:flex;flex-direction:column;transition:opacity .3s}
.welcome-screen.fade{opacity:0}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:var(--welcome-card-w);background:var(--surface);border:1px solid var(--border);border-radius:var(--welcome-card-radius);box-shadow:var(--shadow);padding:var(--welcome-card-pad)}
.head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.logo{height:var(--welcome-logo-h);aspect-ratio:1;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.head h1{margin:0;font-size:22px;font-weight:600;line-height:1.2}.head p{margin:2px 0 0;font-size:14px;color:var(--text2)}
/* two-step indicator (Sub only) */
.stepper{display:flex;gap:8px;align-items:center;margin:0 0 14px;font-size:12px;color:var(--text3)}
.stepper .s{display:flex;align-items:center;gap:6px}.stepper .s i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--surface2);color:var(--text2)}
.stepper .s.now{color:var(--text);font-weight:600}.stepper .s.now i{background:var(--navy);color:#fff}
.stepper .s.done{color:var(--success)}.stepper .s.done i{background:var(--success);color:#fff}
.stepper .ln{flex:1;height:2px;background:var(--border)}.stepper .ln.done{background:var(--success)}
.drop{aspect-ratio:var(--welcome-drop-ratio);border:1.5px dashed var(--text3);border-radius:12px;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:12px;transition:.15s;cursor:pointer}
.drop:hover,.drop:focus-visible{border-color:var(--blue);background:var(--surface2);outline:none}
.drop-top{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--text2);text-align:center;flex-wrap:wrap}
.drop-top .ic{font-size:20px;color:var(--blue)}
.drop .hint{text-align:center;font-size:12px;color:var(--text3)}
.btn{min-height:var(--btn-h);padding:0 14px;border-radius:var(--radius);font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--surface2)}.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn-primary:hover{filter:brightness(1.12);background:var(--navy)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.slot .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface2);color:var(--text2)}
.slot .nm{font-weight:600;font-size:13px}.slot .st{font-size:12px;color:var(--text3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .x{border:0;background:none;color:var(--text3);cursor:pointer;font-size:14px;padding:4px}
.slot.ok{border-color:var(--success);background:var(--success-bg)}.slot.ok .n{background:var(--success);color:#fff}.slot.ok .st{color:var(--success)}
.slot.bad{border-color:var(--danger-bd);background:var(--danger-bg)}.slot.bad .n{background:var(--danger);color:#fff}.slot.bad .st{color:var(--danger);white-space:normal}
.slot.chk .st{color:var(--blue)}
.alert{margin:0 0 10px;padding:10px 12px;border-radius:var(--radius);background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);font-size:13px}
.actions{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px;min-height:var(--btn-h)}
.help{color:var(--blue);font-size:13px;background:none;border:0;cursor:pointer;padding:0}.help:hover{text-decoration:underline}
.steps{display:flex;flex-direction:column;gap:10px;padding:8px 4px}
.step{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--text3)}
.step .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:11px;flex:none}
.step.done{color:var(--text)}.step.done .d{background:var(--success);border-color:var(--success);color:#fff}
.step.now{color:var(--text);font-weight:600}.step.now .d{border-color:var(--blue);border-top-color:transparent;animation:sp .8s linear infinite}
.step.fail{color:var(--danger)}.step.fail .d{background:var(--danger);border-color:var(--danger);color:#fff}
.step .t{margin-left:auto;font-size:12px;color:var(--text3);font-weight:400}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.step.now .d{animation:none;border-top-color:var(--blue)}}
.bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin:6px 4px 0}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s}
.foot{display:flex;justify-content:space-between;padding:10px 20px;font-size:12px;color:var(--text3);border-top:1px solid var(--border)}
.overlay{position:fixed;inset:var(--rv-h,40px) 0 0 0;z-index:40;background:rgba(31,58,95,.82);display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}.overlay div{border:2px dashed #fff;border-radius:16px;padding:40px 60px;color:#fff;font-size:20px;font-weight:600;text-align:center}
.overlay small{display:block;font-size:13px;font-weight:400;margin-top:6px;opacity:.85}
.shell{position:fixed;inset:var(--rv-h,40px) 0 0 0;z-index:30;display:none;flex-direction:column;background:var(--bg)}.shell.show{display:flex}
.shell .tb{background:var(--navy);color:#fff;padding:12px 20px;font-weight:600}.shell .mb{background:var(--surface);border-bottom:1px solid var(--border);height:40px}
.shell .c{flex:1;display:grid;place-items:center;color:var(--text3);font-size:14px;text-align:center}
.note{position:fixed;right:12px;bottom:46px;max-width:320px;background:#0d1b2a;color:#dfe7f0;font-size:12px;padding:10px 12px;border-radius:8px;opacity:.95;z-index:60}
.note b{color:#fff}
</style>
</head>
<body>
<div class="rv" id="rv"><b>Dashboard:</b><span id="dbs"></span><span class="sep"></span><b>State:</b><span id="sts"></span><span class="sp"></span><button id="th" type="button">Theme: light</button></div>

<main class="welcome-screen" id="ws">
  <div class="center">
    <section class="card" aria-labelledby="wt">
      <div class="head"><div class="logo" role="img" aria-label="UESH">UESH</div>
        <div><h1 id="wt"></h1><p id="wi"></p></div></div>
      <div id="stepper"></div>
      <div id="body"></div>
      <div class="actions"><button class="help" type="button" id="help"></button><span id="act"></span></div>
    </section>
  </div>
  <footer class="foot"><span>🛡 Works offline — your data stays in this browser</span><span id="ver"></span></footer>
</main>
<div class="overlay" id="ov"><div id="ovt"></div></div>
<div class="shell" id="shell"><div class="tb" id="shellTitle"></div><div class="mb"></div><div class="c"><div>Dashboard shell opens here.<br><br><button class="btn" id="back" type="button">Back to the welcome mockup</button></div></div></div>
<div class="note" id="note"></div>

<script>
/* ===== One config per dashboard. In the real build this comes from ui_help.json + the source contract. ===== */
const CONFIG={
 mdl:{label:'MDL',title:'Master Document List Dashboard',version:'v3.4',projectTitle:'TWRP C3B2',
  instruction:'Load the project workbook to start.',
  files:[{key:'mdl',name:'Master Document List',sample:'MDL_TWRP_C3B2_rev12.xlsx'}],
  mode:'auto', phases:['Reading the workbook','Checking the data','Building the dashboard'],
  help:'What file do I need?'},
 ppp:{label:'PPP',title:'Procurement Package Plan Dashboard',version:'v1.6',projectTitle:'TWRP C3B2',
  instruction:'Load the project workbook to start.',
  files:[{key:'ppp',name:'Procurement Package Plan',sample:'PPP_TWRP_C3B2_2026-11.xlsx'}],
  mode:'auto', phases:['Reading the workbook','Checking the data','Building the dashboard'],
  help:'What file do I need?'},
 sub:{label:'Sub',title:'Document Submittal Dashboard',version:'SUB v2.2.0',projectTitle:'TWRP C3B2',
 instruction:'Load the two project workbooks to start.',
  files:[{key:'mdl',name:'Master Document List',sample:'MDL_TWRP_C3B2_rev12.xlsx'},
         {key:'log',name:'Document Submittal Log',sample:'Submittal_Log_2026-11.xlsx'}],
  mode:'confirm', phases:['Reading the workbooks','Checking the data','Building the dashboard'],
  help:'What files do I need?'}
};
/* States. "single" = only for 1-file dashboards, "multi" = only for multi-file dashboards. */
const STATES=[
 ['empty','1 Empty'],['partial','2 Some files','multi'],['checking','3 Checking'],['ready','4 Ready','multi'],
 ['fileErr','5 File error'],['setErr','6 Selection error','multi'],['loading','7 Loading (animated)'],['loadErr','7b Load error'],['drag','8 Drag over page']];
let db='sub',cur='empty',timers=[];
const $=id=>document.getElementById(id);
const clearT=()=>{timers.forEach(clearTimeout);timers=[]};
const C=()=>CONFIG[db], N=()=>C().files.length, multi=()=>N()>1;

function slot(i,f,st,cls,x){return `<div class="slot ${cls}"><span class="n">${cls==='ok'?'✓':cls==='bad'?'!':i+1}</span><div><div class="nm">${f.name}</div><div class="st">${st}</div></div>${x?'<button class="x" type="button" aria-label="Remove '+f.name+'">✕</button>':''}</div>`}
function slots(spec){/* spec: array of [state,text] per file; default = still needed */
 return C().files.map((f,i)=>{const s=spec[i]||['none'];
  if(s[0]==='ok')return slot(i,f,'✓ '+f.sample+(s[1]?' · '+s[1]:''),'ok',1);
  if(s[0]==='chk')return slot(i,f,'⟳ Checking the Code sheet…','chk');
  if(s[0]==='bad')return slot(i,f,'✗ '+s[1],'bad',1);
  return slot(i,f,'○ Still needed','');}).join('')}
function drop(inner,alert){
 const one=!multi();
 return `${alert?`<div class="alert" role="alert">${alert}</div>`:''}
 <div class="drop" tabindex="0" aria-label="${one?'Drop the workbook here, or press Enter to choose a file':'Drop the workbooks here, or press Enter to choose files'}">
 <div class="drop-top"><span class="ic">⇪</span>${one?'Drop the file here, or':'Drop the files here (one at a time or all together), or'} <button class="btn" type="button">${one?'Choose file':'Choose files'}</button></div>
 <div class="slots" aria-live="polite">${inner}</div>
 ${one?'<div class="hint">The dashboard opens as soon as the file passes the check.</div>':''}</div>`}
function stepper(step){/* Sub only: Step 1 select & check, Step 2 load */
 if(C().mode!=='confirm'){$('stepper').innerHTML='';return}
 const a=step>1?'done':'now',b=step>2?'done':step===2?'now':'';
 $('stepper').innerHTML=`<div class="stepper" aria-label="Progress"><span class="s ${a}"><i>${a==='done'?'✓':1}</i>Select and check ${N()} files</span><span class="ln ${a==='done'?'done':''}"></span><span class="s ${b}"><i>${b==='done'?'✓':2}</i>Load the dashboard</span></div>`}
function actionBtn(n,dis,label){
 if(C().mode==='auto'){$('act').innerHTML='';return}/* 1-step: no Load button */
 $('act').innerHTML=`<button class="btn btn-primary" id="load" type="button" ${dis?'disabled':''}>${label||(n<N()?`Load dashboard (${n} of ${N()})`:'Load dashboard')}</button>`;
 const b=$('load');if(b&&!dis)b.onclick=()=>show('loading')}

function show(s){
 clearT();cur=s;const c=C();
 $('shell').classList.remove('show');$('ws').classList.remove('fade');$('ov').classList.remove('show');
 $('wt').textContent=c.title;$('wi').textContent=c.instruction;$('help').textContent=c.help;
 $('ver').textContent=`${c.version} · © ${new Date().getFullYear()} UESH`;
 $('ovt').innerHTML=multi()?`Release to add the files<small>Drop anywhere on the page · up to ${N()} workbooks</small>`:'Release to load the workbook<small>Drop anywhere on the page</small>';
 const all=c.files.map(()=>['ok']);let note='';
 switch(s){
  case 'empty':$('body').innerHTML=drop(slots([]));actionBtn(0,1);stepper(1);
   note=multi()?`<b>Sub, empty.</b> ${N()} slots, one per required file, from the source contract. Step 1 of 2 is active. The Load button shows the count.`:`<b>${c.label}, empty.</b> One slot. No Load button: this dashboard loads in one step.`;break;
  case 'partial':$('body').innerHTML=drop(slots([['ok','Dashboard Title: Master Document List']]));actionBtn(1,1);stepper(1);
   note='<b>Some files.</b> The user can add files one at a time or all together. Each file goes to its slot by its Dashboard Title, not by its file name (§3.7).';break;
  case 'checking':
   if(multi()){$('body').innerHTML=drop(slots([['ok'],['chk']]));actionBtn(1,1);stepper(1);
    note='<b>Checking.</b> Only the Code sheet of the new file is read (§3.7).';}
   else{$('body').innerHTML=drop(slots([['chk']]));stepper(1);
    note=`<b>${c.label}, checking.</b> The Code sheet is read. If the check passes, the load starts by itself.`;
    timers.push(setTimeout(()=>show('loading'),1500));}
   break;
  case 'ready':$('body').innerHTML=drop(slots(all));actionBtn(N(),0);stepper(2);
   note='<b>Ready.</b> Both files passed. Step 1 is done; step 2 is active. Click <b>Load dashboard</b> to start step 2 (today: the <b>Load Data</b> button).';break;
  case 'fileErr':
   $('body').innerHTML=drop(slots(multi()?[['ok'],['bad','"Book1.xlsx" has no Code sheet. Choose the Submittal Log export.']]:[['bad','"Book1.xlsx" has no Code sheet. Choose the '+c.files[0].name+' export.']]));
   actionBtn(1,1);stepper(1);
   note=multi()?'<b>File error.</b> The reason shows on the slot it is about. The other files stay selected.':`<b>${c.label}, file error.</b> The reason shows on the slot. The user drops or chooses another file; no other action is needed.`;break;
  case 'setErr':$('body').innerHTML=drop(slots(all),'The Project Title values do not match: “TWRP C3B2” in the Master Document List and “PRJ-B” in the Document Submittal Log. Choose two files from the same project. The previous selection is unchanged.');
   actionBtn(N(),1);stepper(1);note='<b>Selection error.</b> A problem with the set of files shows once, above the slots. This state does not exist for a 1-file dashboard.';break;
  case 'loading':case 'loadErr':$('body').innerHTML='<div id="steps"></div>';actionBtn(N(),1,'Loading…');stepper(2);run(s==='loadErr');
   note=(s==='loadErr'?'<b>Load error.</b> The failed phase is marked, then the card returns to the slots with the reason.':'<b>Loading.</b> Load phases run in the same card. The welcome then closes and the shell opens.')+(multi()?' Sub: this is step 2 of 2.':` ${c.label}: this starts by itself after the file check.`);break;
  case 'drag':$('body').innerHTML=drop(slots([]));actionBtn(0,1);stepper(1);$('ov').classList.add('show');
   note='<b>Drag over page.</b> A full-screen drop target (AGENTS §18.7). Click the overlay to close it.';break;
 }
 $('note').innerHTML=note;paintBar();}

function paintSteps(at,fail,times){const el=$('steps');if(!el)return;const P=C().phases;
 el.innerHTML=`<div class="steps" aria-busy="${at<P.length&&fail==null}" aria-live="polite">${P.map((n,i)=>{
  const c=i===fail?'fail':i<at?'done':i===at?'now':'';const d=c==='done'?'✓':c==='fail'?'!':'';
  return `<div class="step ${c}"><span class="d">${d}</span>${n}${c==='now'?'…':''}<span class="t">${times[i]||''}</span></div>`}).join('')}
  <div class="bar"><i style="width:${Math.round(Math.min(at,P.length)/P.length*100)}%"></i></div></div>`}
function run(fail){const P=C().phases,D=[1300,1000,800],times=[];let t=0;paintSteps(0,null,times);
 for(let i=0;i<P.length;i++){t+=D[i];const k=i;
  timers.push(setTimeout(()=>{
   if(fail&&k===1){paintSteps(1,1,times);timers.push(setTimeout(()=>afterLoadErr(),1600));return}
   times[k]=(D[k]/1000).toFixed(1)+' s';paintSteps(k+1,null,times);
   if(k===P.length-1)timers.push(setTimeout(()=>{if(C().mode==='confirm')stepper(3);
    timers.push(setTimeout(()=>{$('ws').classList.add('fade');
     timers.push(setTimeout(()=>{$('shell').classList.add('show');$('shellTitle').textContent=`${C().projectTitle} — ${C().title}`;
      $('note').innerHTML='<b>Load done.</b> The welcome closes. The title bar now shows the project title from the loaded model (§3.7).'},300))},400))},400));
  },t));
  if(fail&&k===1)break;}}
function afterLoadErr(){const c=C();clearT();
 $('body').innerHTML=drop(slots(c.files.map(()=>['ok'])),`The data check failed: the ${c.files[multi()?1:0].name} has no “Document No.” column. Correct the export and load again. ${multi()?'Your files are still selected.':'Drop the corrected file to try again.'}`);
 actionBtn(N(),0,multi()?'Load again':null);stepper(multi()?2:1);
 $('note').innerHTML=multi()?'<b>After a load error.</b> Back to the slots. The files stay selected. <b>Load again</b> retries step 2.':`<b>${c.label}, after a load error.</b> Back to the slot. A new drop starts the check and load again.`}

function paintBar(){
 $('dbs').innerHTML=Object.keys(CONFIG).map(k=>`<button type="button" data-db="${k}" class="${k===db?'on':''}">${CONFIG[k].label} (${CONFIG[k].files.length} file${CONFIG[k].files.length>1?'s':''}, ${CONFIG[k].mode==='auto'?'1 step':'2 steps'})</button>`).join(' ');
 $('sts').innerHTML=STATES.filter(x=>!x[2]||(x[2]==='multi')===multi()).map(x=>`<button type="button" data-s="${x[0]}" class="${x[0]===cur?'on':''}">${x[1]}</button>`).join(' ');
 document.documentElement.style.setProperty('--rv-h',$('rv').offsetHeight+'px');
 document.querySelectorAll('[data-db]').forEach(b=>b.onclick=()=>{db=b.dataset.db;const ok=STATES.find(x=>x[0]===cur&&(!x[2]||(x[2]==='multi')===multi()));show(ok?cur:'empty')});
